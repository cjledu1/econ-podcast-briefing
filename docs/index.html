<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>모닝 경제·경영 2인 팟캐스트 브리핑 | 07:30 AM</title>
  <meta name="description" content="월·수·금 아침 7시 30분, 지난 이틀간의 주요 경제·경영 뉴스 20개를 초보자 눈높이 문답과 용어 해설로 풀어주는 20분 오디오 브리핑" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: hsl(40, 25%, 97%);
      --bg-surface: hsl(0, 0%, 100%);
      --bg-subtle: hsl(38, 22%, 93%);
      --bg-highlight: hsl(160, 35%, 95%);
      --bg-qna: hsl(210, 33%, 96%);
      --text-primary: hsl(215, 28%, 14%);
      --text-secondary: hsl(215, 16%, 36%);
      --text-muted: hsl(215, 12%, 52%);
      --border-soft: hsl(35, 18%, 87%);
      --border-strong: hsl(215, 20%, 78%);
      --accent-primary: hsl(162, 72%, 24%);
      --accent-primary-hover: hsl(162, 72%, 19%);
      --accent-warm: hsl(24, 85%, 44%);
      --accent-blue: hsl(212, 78%, 38%);
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.04);
      --shadow-player: 0 -4px 20px rgba(15, 23, 42, 0.08);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.65;
      letter-spacing: -0.015em;
      padding-bottom: 148px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* Header */
    .masthead {
      border-bottom: 2px solid var(--text-primary);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .masthead-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-primary);
      background: var(--bg-highlight);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    .episode-selector {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 5px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
    }

    .masthead h1 {
      font-size: 1.38rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .host-strip {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    /* Executive Summary Box */
    .exec-summary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .exec-summary-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .exec-summary-text {
      font-size: 0.93rem;
      color: var(--text-primary);
      white-space: pre-line;
      line-height: 1.65;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg-subtle);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px 8px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* Theme Filter Pills */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      white-space: nowrap;
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: var(--text-primary);
      color: var(--bg-surface);
      border-color: var(--text-primary);
    }

    /* Theme Section */
    .theme-section {
      margin-bottom: 28px;
    }

    .theme-header {
      background: var(--bg-subtle);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .theme-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .theme-header p {
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    /* News Card */
    .news-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      transition: transform 0.15s ease;
    }

    .news-card.deep-dive {
      border-color: hsl(162, 45%, 65%);
    }

    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .news-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .num-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .cat-badge {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-blue);
      background: var(--bg-qna);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .deep-badge {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent-warm);
      background: hsl(24, 90%, 94%);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .news-title {
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.42;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .news-summary {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .meaning-box {
      background: var(--bg-highlight);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .meaning-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 4px;
    }

    .meaning-text {
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .qna-box {
      background: var(--bg-qna);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .qna-q {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 6px;
    }

    .qna-a {
      font-size: 0.89rem;
      color: var(--text-primary);
    }

    .news-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-soft);
      font-size: 0.8rem;
    }

    .term-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .term-tag {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .source-link {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    /* Glossary Grid */
    .glossary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }

    .glossary-term {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 6px;
    }

    .glossary-def {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .glossary-analogy {
      font-size: 0.89rem;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }

    /* Dialogue Transcript */
    .dialogue-turn {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .dialogue-turn.speaker-q {
      background: var(--bg-qna);
    }

    .speaker-name {
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: inline-block;
    }

    .speaker-q .speaker-name {
      color: var(--accent-blue);
    }

    .speaker-e .speaker-name {
      color: var(--accent-primary);
    }

    .dialogue-text {
      font-size: 0.93rem;
      color: var(--text-primary);
    }

    /* Sticky Bottom Audio Player */
    .sticky-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-strong);
      box-shadow: var(--shadow-player);
      padding: 12px 16px 16px;
      z-index: 100;
    }

    .player-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .now-playing-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .scrubber {
      width: 100%;
      accent-color: var(--accent-primary);
      cursor: pointer;
      height: 6px;
      margin-bottom: 10px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-play {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play:hover {
      background: var(--accent-primary-hover);
    }

    .btn-skip, .btn-speed {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-soft);
      padding: 7px 11px;
      border-radius: var(--radius-sm);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="masthead">
      <div class="masthead-top">
        <span class="brand-tag" id="engine-badge">MON·WED·FRI 07:30 BRIEFING</span>
        <select id="episode-select" class="episode-selector" aria-label="지난 브리핑 선택"></select>
      </div>
      <h1 id="ep-title">모닝 경제·경영 2인 팟캐스트 브리핑</h1>
      <div class="host-strip">
        <span class="host-badge">🙋 질문자 <strong>지민</strong> (경제 입문자)</span>
        <span class="host-badge">🎙️ 해설자 <strong>현우</strong> (경제·경영 멘토)</span>
      </div>
    </header>

    <section class="exec-summary-card" aria-label="오늘의 핵심 3줄 요약">
      <div class="exec-summary-title">
        <span>📌 오늘 아침 핵심 맥락 요약</span>
        <span id="ep-date-label"></span>
      </div>
      <p class="exec-summary-text" id="ep-summary"></p>
    </section>

    <nav class="nav-tabs" aria-label="콘텐츠 보기 전환">
      <button type="button" class="tab-btn active" id="tab-btn-news" data-tab="news">📰 20대 뉴스 & 의미</button>
      <button type="button" class="tab-btn" id="tab-btn-glossary" data-tab="glossary">📖 용어 사전 (<span id="glossary-count">0</span>)</button>
      <button type="button" class="tab-btn" id="tab-btn-script" data-tab="script">💬 2인 대화 대본</button>
    </nav>

    <!-- 탭 1: 20대 뉴스 & 의미 해설 -->
    <section id="view-news">
      <div class="filter-bar" id="filter-bar"></div>
      <div id="news-list-container"></div>
    </section>

    <!-- 탭 2: 경제/경영 용어 사전 -->
    <section id="view-glossary" class="hidden">
      <div id="glossary-list-container"></div>
    </section>

    <!-- 탭 3: 2인 팟캐스트 대본 -->
    <section id="view-script" class="hidden">
      <div id="script-list-container"></div>
    </section>
  </main>

  <!-- 하단 고정 오디오 플레이어 -->
  <aside class="sticky-player" aria-label="팟캐스트 오디오 플레이어">
    <div class="player-inner">
      <audio id="podcast-audio" preload="metadata"></audio>
      <div class="player-top">
        <span class="now-playing-label" id="player-status-text">🎧 출근길 2인 경제/경영 팟캐스트 오디오 브리핑</span>
        <span class="time-readout" id="player-time">00:00 / 00:00</span>
      </div>
      <input type="range" id="audio-scrubber" class="scrubber" min="0" max="100" value="0" step="0.1" aria-label="오디오 탐색 바" />
      <div class="player-controls">
        <div class="ctrl-group">
          <button type="button" class="btn-play" id="btn-play-toggle">▶ 브리핑 재생</button>
          <button type="button" class="btn-skip" id="btn-rw-15">-15초</button>
          <button type="button" class="btn-skip" id="btn-ff-15">+15초</button>
        </div>
        <div class="ctrl-group">
          <button type="button" class="btn-speed" id="btn-speed-cycle">1.0x 배속</button>
        </div>
      </div>
    </div>

됩니다.", "key_terms": ["국내 경제/기업", "시장 시그널"]}], "glossary": [{"term": "기준금리", "simple_def": "중앙은행이 시중 은행과 거래할 때 기준이 되는 금리", "analogy": "경제 전체의 돈의 온도를 조절하는 보일러 온도 조절기"}, {"term": "환율", "simple_def": "외국 돈과 우리 돈의 교환 비율", "analogy": "해외 직구나 수출을 할 때 적용되는 달러의 가격표"}], "dialogue": [{"speaker": "지민", "theme_id": "opening", "text": "안녕하세요 여러분! 상쾌한 월요일 아침 7시 30분입니다. 경제 뉴스만 보면 외계어 같아서 한숨부터 쉬던 경제 입문자 지민이에요! 어우, 현우 선배님, 지난 이틀 동안에도 우리 지갑이랑 회사 경영에 직결되는 뉴스들이 엄청 쏟아졌더라고요?"}, {"speaker": "현우", "theme_id": "opening", "text": "하하, 맞아요 지민님! 출근길에 함께해 주시는 청취자분들도 반갑습니다. 오늘도 지난 이틀 동안 나온 뉴스 중에서 진짜 꼭 알아야 할 스무 개만 딱 골라서 네 가지 테마로 묶어 왔거든요. 어려운 용어는 오늘도 제가 커피 한 잔 마시면서 수다 떨듯이 아주 쉽게 비유로 풀어드릴게요!"}, {"speaker": "지민", "theme_id": "theme_1", "text": "좋아요! 그럼 바로 '1. 국내 경제와 주요 기업 경영 이슈' 이야기부터 들어가 볼까요? 선배님, 이번 파트에서 우리가 제일 주목해야 할 흐름이 뭔가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "음... 쉽게 말해서 이런 흐름이에요. 국내 주요 산업과 기업들의 최신 경영 전략과 시장 변화를 짚어봅니다. 여기에 연결된 다섯 가지 뉴스를 하나씩 같이 뜯어볼까요?"}, {"speaker": "지민", "theme_id": "theme_1", "text": "어? 선배님, '15억 넘는 집 대출 조였더니…수도권 주담대 급감, 비수도권은 되레 늘었다'라는 기사가 눈에 띄는데요, 이게 구체적으로 어떤 내용이고 왜 지금 화제가 되는 건가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "하하, 지민님 핵심을 잘 짚으셨어요! 쉽게 말해서 10·15 대책 전후 10개월 비교 수도권 증가액 37조→18조 비수도권은 19조 안팎 유지정부가 지난해 10월 고가주택에 대한 주택담보대출 한도를 대폭 축소한 이후 수도권과 비수.. 시장의 돈과 기업의 투자가 어디로 움직이는지 보여주는 중요한 신호탄이라고 보면 돼요."}, {"speaker": "지민", "theme_id": "theme_1", "text": "아~ 그런 맥락이 있었군요! 그러면 이게 당장 우리 같은 직장인이나 회사 경영에는 어떤 영향을 주게 될까요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "이런 변화가 생기면 기업들은 투자 우선순위를 조정하게 되고, 우리 개인 입장에서도 소비나 재테크 방향을 잡을 때 꼭 참고해야 할 이정표가 됩니다."}, {"speaker": "지민", "theme_id": "theme_1", "text": "어? 선배님, 'KB금융 이재근 회장 “리딩뱅크 넘어 ‘리딩플랫폼’ 돼야”'라는 기사가 눈에 띄는데요, 이게 구체적으로 어떤 내용이고 왜 지금 화제가 되는 건가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "하하, 지민님 핵심을 잘 짚으셨어요! 쉽게 말해서 데이터·AI 결합해 플랫폼 경쟁력 강화이재근 KB금융그룹 회장이 취임사에서 ‘리딩플랫폼’을 핵심 키워드로 제시했다. 계열사 간 협업을 강화하고 데이터와 인공지능(AI)을 결합해 금.. 시장의 돈과 기업의 투자가 어디로 움직이는지 보여주는 중요한 신호탄이라고 보면 돼요."}, {"speaker": "지민", "theme_id": "the     const scrubber = document.getElementById('audio-scrubber');
    const timeLabel = document.getElementById('player-time');
    const statusText = document.getElementById('player-status-text');

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function renderEpisode(ep) {
      currentEpisode = ep;
      document.getElementById('ep-title').textContent = ep.episode_title || '모닝 경제·경영 2인 팟캐스트';
      document.getElementById('ep-date-label').textContent = ep.generated_at || ep.date || '';
      document.getElementById('ep-summary').textContent = ep.executive_summary || '';
      document.getElementById('glossary-count').textContent = (ep.glossary || []).length;

      const engine = (ep.audio && ep.audio.engine_used) || 'NOTEBOOKLM';
      const badgeEl = document.getElementById('engine-badge');
      badgeEl.textContent = engine.includes('NOTEBOOKLM')
        ? 'NOTEBOOKLM 2인 오디오 브리핑'
        : 'AI 2인 멀티보이스 브리핑';

      if (ep.audio && ep.audio.url) {
        audioEl.src = ep.audio.url;
      }

      renderFilters(ep);
      renderNewsList(ep);
      renderGlossary(ep);
      renderDialogue(ep);
    }

    function renderFilters(ep) {
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = '';
      const filters = [
        { id: 'all', label: '전체 뉴스 (20)' },
        { id: 'deep', label: '★ 심층 해설 이슈' },
        ...(ep.themes || []).map(t => ({ id: t.id, label: t.title.replace(/^[0-9]+\.\s*/, '') }))
      ];
      filters.forEach(f => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip' + (activeFilter === f.id ? ' active' : '');
        btn.textContent = f.label;
        btn.addEventListener('click', () => {
          activeFilter = f.id;
          renderFilters(currentEpisode);
          renderNewsList(currentEpisode);
        });
        bar.appendChild(btn);
      });
    }

    function renderNewsList(ep) {
      const container = document.getElementById('news-list-container');
      container.innerHTML = '';
      const themes = ep.themes || [];
      const items = ep.news_items || [];

      themes.forEach(theme => {
        if (activeFilter !== 'all' && activeFilter !== 'deep' && activeFilter !== theme.id) return;

        const themeItems = items.filter(item => {
          if (item.theme_id !== theme.id) return false;
          if (activeFilter === 'deep') return Boolean(item.is_deep_dive);
          return true;
        });

        if (themeItems.length === 0) return;

        const sec = document.createElement('div');
        sec.className = 'theme-section';
        sec.innerHTML = `
          <div class="theme-header">
            <h2>${theme.title}</h2>
            <p>${theme.summary}</p>
          </div>
        `;

        themeItems.forEach(item => {
          const card = document.createElement('article');
          card.className = 'news-card' + (item.is_deep_dive ? ' deep-dive' : '');
          const qna = item.beginner_qna || {};
          const termsHtml = (item.key_terms || [])
            .map(t => `<span class="term-tag">#${t}</span>`)
            .join('');

          card.innerHTML = `
            <div class="news-meta">
              <div class="news-badges">
                <span class="num-badge">NEWS #${item.id}</span>
                <span class="cat-badge">${item.category || '경제/경영'}</span>
                ${item.is_deep_dive ? '<span class="deep-badge">★ 핵심 심층해설</span>' : ''}
              </div>
              <span style="font-size:0.78rem;color:var(--text-muted)">${item.source || ''}</span>
            </div>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-summary">${item.summary}</p>
            <div class="meaning-box">
              <div class="meaning-label">💡 경제·경영적 의미 (왜 중요할까요?)</div>
              <div class="meaning-text">${item.economic_meaning}</div>
            </div>
            ${qna.question ? `
            <div class="qna-box">
              <div class="qna-q">🙋 지민의 질문: "${qna.question}"</div>
              <div class="qna-a">🎙️ 현우의 해설: "${qna.answer}"</div>
            </div>` : ''}
            <div class="news-footer">
              <div class="term-tags">${termsHtml}</div>
              <a class="source-link" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">원문 기사 보기 ↗</a>
            </div>
          `;
          sec.appendChild(card);
        });

        container.appendChild(sec);
      });
    }

    function renderGlossary(ep) {
      const container = document.getElementById('glossary-list-container');
      container.innerHTML = '';
      (ep.glossary || []).forEach(g => {
        const div = document.createElement('div');
        div.className = 'glossary-card';
        div.innerHTML = `
          <div class="glossary-term">🔹 ${g.term}</div>
          <div class="glossary-def">${g.simple_def}</div>
          <div class="glossary-analogy">💬 <strong>일상 비유:</strong> ${g.analogy}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderDialogue(ep) {
      const container = document.getElementById('script-list-container');
      container.innerHTML = '';
      (ep.dialogue || []).forEach(turn => {
        const isQ = turn.speaker === '지민';
        const div = document.createElement('div');
        div.className = 'dialogue-turn ' + (isQ ? 'speaker-q' : 'speaker-e');
        div.innerHTML = `
          <span class="speaker-name">${isQ ? '🙋 지민 (질문자)' : '🎙️ 현우 (경제 멘토)'}</span>
          <p class="dialogue-text">${turn.text}</p>
        `;
        container.appendChild(div);
      });
    }

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('view-news').classList.toggle('hidden', tab !== 'news');
        document.getElementById('view-glossary').classList.toggle('hidden', tab !== 'glossary');
        document.getElementById('view-script').classList.toggle('hidden', tab !== 'script');
      });
    });

    // 오디오 컨트롤
    playBtn.addEventListener('click', () => {
      if (audioEl.paused) {
        audioEl.play().then(() => {
          playBtn.textContent = '⏸ 일시정지';
        }).catch(() => {
          // 오디오 파일 로드 전이거나 브라우저 내장 음성 테스트 시
          statusText.textContent = '🎧 오디오 파일을 불러오는 중입니다...';
        });
      } else {
        audioEl.pause();
        playBtn.textContent = '▶ 브리핑 재생';
      }
    });

    audioEl.addEventListener('timeupdate', () => {
      if (audioEl.duration) {
        scrubber.value = (audioEl.currentTime / audioEl.duration) * 100;
        timeLabel.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      timeLabel.textContent = `00:00 / ${formatTime(audioEl.duration)}`;
    });

    audioEl.addEventListener('ended', () => {
      playBtn.textContent = '▶ 다시 재생';
    });

    scrubber.addEventListener('input', () => {
      if (audioEl.duration) {
        audioEl.currentTime = (scrubber.value / 100) * audioEl.duration;
      }
    });

    document.getElementById('btn-rw-15').addEventListener('click', () => {
      audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
    });

    document.getElementById('btn-ff-15').addEventListener('click', () => {
      audioEl.currentTime = Math.min(audioEl.duration || 9999, audioEl.currentTime + 15);
    });

    document.getElementById('btn-speed-cycle').addEventListener('click', (e) => {
      speedIdx = (speedIdx + 1) % speeds.length;
      audioEl.playbackRate = speeds[speedIdx];
      e.target.textContent = `${speeds[speedIdx].toFixed(2).replace(/\.00$/, '.0')}x 배속`;
    });

    // 에피소드 드롭다운 초기화
    const selectEl = document.getElementById('episode-select');
    EPISODES_INDEX.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.date;
      opt.textContent = `${item.date} (${item.weekday}) 브리핑`;
      selectEl.appendChild(opt);
    });

    selectEl.addEventListener('change', async (e) => {
      const epDate = e.target.value;
      try {
        const res = await fetch(`episodes/${epDate}.json`);
        if (res.ok) {
          const data = await res.json();
          renderEpisode(data);
        }
      } catch (err) {
        console.error(err);
      }
    });

    renderEpisode(INITIAL_EPISODE);
  </script>
</body>
</html>
