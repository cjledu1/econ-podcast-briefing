<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>모닝 경제·경영 2인 팟캐스트 브리핑 | 07:30 AM</title>
  <meta name="description" content="월·수·금 아침 7시 30분, 지난 이틀간의 주요 경제·경영 뉴스 20개를 초보자 눈높이 문답과 용어 해설로 풀어주는 20분 오디오 브리핑" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: hsl(40, 25%, 97%);
      --bg-surface: hsl(0, 0%, 100%);
      --bg-subtle: hsl(38, 22%, 93%);
      --bg-highlight: hsl(160, 35%, 95%);
      --bg-qna: hsl(210, 33%, 96%);
      --text-primary: hsl(215, 28%, 14%);
      --text-secondary: hsl(215, 16%, 36%);
      --text-muted: hsl(215, 12%, 52%);
      --border-soft: hsl(35, 18%, 87%);
      --border-strong: hsl(215, 20%, 78%);
      --accent-primary: hsl(162, 72%, 24%);
      --accent-primary-hover: hsl(162, 72%, 19%);
      --accent-warm: hsl(24, 85%, 44%);
      --accent-blue: hsl(212, 78%, 38%);
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.04);
      --shadow-player: 0 -4px 20px rgba(15, 23, 42, 0.08);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.65;
      letter-spacing: -0.015em;
      padding-bottom: 148px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* Header */
    .masthead {
      border-bottom: 2px solid var(--text-primary);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .masthead-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-primary);
      background: var(--bg-highlight);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    .episode-selector {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 5px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
    }

    .masthead h1 {
      font-size: 1.38rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .host-strip {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    /* Executive Summary Box */
    .exec-summary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .exec-summary-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .exec-summary-text {
      font-size: 0.93rem;
      color: var(--text-primary);
      white-space: pre-line;
      line-height: 1.65;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg-subtle);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px 8px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* Theme Filter Pills */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      white-space: nowrap;
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: var(--text-primary);
      color: var(--bg-surface);
      border-color: var(--text-primary);
    }

    /* Theme Section */
    .theme-section {
      margin-bottom: 28px;
    }

    .theme-header {
      background: var(--bg-subtle);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .theme-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .theme-header p {
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    /* News Card */
    .news-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      transition: transform 0.15s ease;
    }

    .news-card.deep-dive {
      border-color: hsl(162, 45%, 65%);
    }

    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .news-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .num-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .cat-badge {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-blue);
      background: var(--bg-qna);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .deep-badge {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent-warm);
      background: hsl(24, 90%, 94%);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .news-title {
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.42;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .news-summary {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .meaning-box {
      background: var(--bg-highlight);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .meaning-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 4px;
    }

    .meaning-text {
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .qna-box {
      background: var(--bg-qna);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .qna-q {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 6px;
    }

    .qna-a {
      font-size: 0.89rem;
      color: var(--text-primary);
    }

    .news-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-soft);
      font-size: 0.8rem;
    }

    .term-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .term-tag {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }

    .source-link {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    /* Glossary Grid */
    .glossary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }

    .glossary-term {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 6px;
    }

    .glossary-def {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .glossary-analogy {
      font-size: 0.89rem;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }

    /* Dialogue Transcript */
    .dialogue-turn {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .dialogue-turn.speaker-q {
      background: var(--bg-qna);
    }

    .speaker-name {
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: inline-block;
    }

    .speaker-q .speaker-name {
      color: var(--accent-blue);
    }

    .speaker-e .speaker-name {
      color: var(--accent-primary);
    }

    .dialogue-text {
      font-size: 0.93rem;
      color: var(--text-primary);
    }

    /* Sticky Bottom Audio Player */
    .sticky-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-strong);
      box-shadow: var(--shadow-player);
      padding: 12px 16px 16px;
      z-index: 100;
    }

    .player-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .now-playing-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .scrubber {
      width: 100%;
      accent-color: var(--accent-primary);
      cursor: pointer;
      height: 6px;
      margin-bottom: 10px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-play {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play:hover {
      background: var(--accent-primary-hover);
    }

    .btn-skip, .btn-speed {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-soft);
      padding: 7px 11px;
      border-radius: var(--radius-sm);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="masthead">
      <div class="masthead-top">
        <span class="brand-tag" id="engine-badge">MON·WED·FRI 07:30 BRIEFING</span>
        <select id="episode-select" class="episode-selector" aria-label="지난 브리핑 선택"></select>
      </div>
      <h1 id="ep-title">모닝 경제·경영 2인 팟캐스트 브리핑</h1>
      <div class="host-strip">
        <span class="host-badge">🙋 질문자 <strong>지민</strong> (경제 입문자)</span>
        <span class="host-badge">🎙️ 해설자 <strong>현우</strong> (경제·경영 멘토)</span>
      </div>
    </header>

    <section class="exec-summary-card" aria-label="오늘의 핵심 3줄 요약">
      <div class="exec-summary-title">
        <span>📌 오늘 아침 핵심 맥락 요약</span>
        <span id="ep-date-label"></span>
      </div>
      <p class="exec-summary-text" id="ep-summary"></p>
    </section>

    <nav class="nav-tabs" aria-label="콘텐츠 보기 전환">
      <button type="button" class="tab-btn active" id="tab-btn-news" data-tab="news">📰 20대 뉴스 & 의미</button>
      <button type="button" class="tab-btn" id="tab-btn-glossary" data-tab="glossary">📖 용어 사전 (<span id="glossary-count">0</span>)</button>
      <button type="button" class="tab-btn" id="tab-btn-script" data-tab="script">💬 2인 대화 대본</button>
    </nav>

    <!-- 탭 1: 20대 뉴스 & 의미 해설 -->
    <section id="view-news">
      <div class="filter-bar" id="filter-bar"></div>
      <div id="news-list-container"></div>
    </section>

    <!-- 탭 2: 경제/경영 용어 사전 -->
    <section id="view-glossary" class="hidden">
      <div id="glossary-list-container"></div>
    </section>

    <!-- 탭 3: 2인 팟캐스트 대본 -->
    <section id="view-script" class="hidden">
      <div id="script-list-container"></div>
    </section>
  </main>

  <!-- 하단 고정 오디오 플레이어 -->
  <aside class="sticky-player" aria-label="팟캐스트 오디오 플레이어">
    <div class="player-inner">
      <audio id="podcast-audio" preload="metadata"></audio>
      <div class="player-top">
        <span class="now-playing-label" id="player-status-text">🎧 출근길 2인 경제/경영 팟캐스트 오디오 브리핑</span>
        <span class="time-readout" id="player-time">00:00 / 00:00</span>
      </div>
      <input type="range" id="audio-scrubber" class="scrubber" min="0" max="100" value="0" step="0.1" aria-label="오디오 탐색 바" />
      <div class="player-controls">
        <div class="ctrl-group">
          <button type="button" class="btn-play" id="btn-play-toggle">▶ 브리핑 재생</button>
          <button type="button" class="btn-skip" id="btn-rw-15">-15초</button>
          <button type="button" class="btn-skip" id="btn-ff-15">+15초</button>
        </div>
        <div class="ctrl-group">
          <button type="button" class="btn-speed" id="btn-speed-cycle">1.0x 배속</button>
        </div>
      </div>
    </div>
  </aside>

  <script>

wstv.co.kr/news/AKR20261120090706PIP", "summary": "삼성전자가 전영현·노태문 투톱 대표 체제를 유지하면서 메모리와 모바일경험 사업부장을 신규 선임해 겸직을 전격 분리했습니다. 실무 사장들을 전진 배치해 AI 반도체와 스마트폰 현장 실행력을 대폭 강화하려는 포석입니다.", "beginner_qna": {"question": "선배님, 삼성전자가 큰 틀의 대표는 그대로 두면서 사업부장 겸직을 풀었다는데, 이게 회사 안에서 구체적으로 뭐가 달라진 건가요? 총사령관 자리는 그대로인 거잖아요?", "answer": "하하, 지민님! 대형 레스토랑으로 비유하자면요, 총괄 지배인이 매장 전체 경영도 챙기면서 주방장 모자까지 쓰고 메인 요리까지 직접 만들다가, 이번에 각 파트 전문 셰프들에게 칼자루를 온전히 넘겨준 셈이에요! 전영현, 노태문 부회장은 파운드리나 차세대 로봇 같은 미래 밑그림을 그리고, 메모리와 갤럭시폰 현장은 실무 사장들이 책임지고 전력 질주하게 만든 거죠.", "followup_question": "아~ 지배인은 전체 매장 확장에 집중하고 주방은 전문 셰프가 꽉 잡는 거군요! 그럼 이게 우리 주식 투자자나 IT 업계 판도에는 어떤 신호로 해석되나요?"}, "economic_meaning": "그렇죠! HBM 같은 AI 반도체 주도권 싸움에서 한 치의 오차도 허용하지 않겠다는 강력한 위기의식의 발로예요. 의사결정 단계를 한층 좁혔기 때문에 시장의 급변하는 고객사 요구에 대응하는 속도가 훨씬 빨라질 나비효과를 기대할 수 있습니다.", "key_terms": ["사업부장 분리", "경영 효율화"], "fact_summary": "삼성전자가 전영현·노태문 투톱 대표 체제를 유지하면서 메모리와 모바일경험 사업부장을 신규 선임해 겸직을 전격 분리했습니다. 실무 사장들을 전진 배치해 AI 반도체와 스마트폰 현장 실행력을 대폭 강화하려는 포석입니다."}, {"id": 2, "theme_id": "theme_1", "is_deep_dive": false, "category": "국내 경제/기업", "title": "‘본드 냄새·용접 불꽃의 결실’…대한민국 연간 수출 사상 첫 1조 달러 돌파", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12213598", "summary": "대한민국이 세계에서 네 번째로 연간 수출 1조 달러라는 역사적 금자탑을 세웠습니다. 건어물을 싣고 떠나던 무역선에서 출발해 반도체와 첨단 제조업을 앞세워 이뤄낸 국가적 쾌거입니다.", "beginner_qna": {"question": "연간 수출 1조 달러라니 숫자가 너무 커서 실감이 잘 안 나는데, 이게 글로벌 시장에서 얼마나 대단한 위치에 오른 건가요?", "answer": "음... 쉽게 비유하자면요, 전 세계라는 거대한 글로벌 백화점에서 미국, 중국, 독일이라는 거물급 매장에 이어 한국 매장이 4번째로 큰 매출 전표를 찍은 거나 다름없어요! 한때 아시아 제조업의 맹주였던 일본조차 밟아보지 못한 꿈의 고지랍니다.", "followup_question": "우와, 일본도 못 가본 길이라니 국뽕이 차오르네요! 그런데 요즘 보호무역주의가 심한데 이 기세가 우리 월급봉투까지 쭉 이어질 수 있을까요?"}, "economic_meaning": "바로 그 지점이 핵심이에요. 수출 1조 달러는 제조업 경쟁력을 증명한 훈장이지만, 특정 품목 의존도를 낮추지 못하면 글로벌 통상 압박 때 충격이 커질 수 있거든요. 중견·중소기업 낙수효과로 이어져야 내수 경기와 양질의 일자리가 탄탄해집니다.", "key_terms": ["수출 1조 달러", "글로벌 무역 4강"], "fact_summary": "대한민국이 세계에서 네 번째로 연간 수출 1조 달러라는 역사적 금자탑을 세웠습니다. 건어물을 싣고 떠나던 무역선에서 출발해 반도체와 첨단 제조업을 앞세워 이뤄낸 국가적 쾌거입니다."}, {"id": 3, "theme_id": "theme_1", "is_deep_dive": false, "category": "글로벌 거시/빅테크", "title": "51조 시장 ‘빛의 반도체’ 애플도 전격 참전…삼성·SK하이닉스와 불꽃 경쟁", "source": "매일경제", "url": "https://www.mk.co.kr/news/business/12213984", "summary": "애플이 AI 데이터센터의 전력 소모를 획기적으로 줄여줄 실리콘 포토닉스 기술 개발에 직접 뛰어들었습니다. 차세대 51조 원 규모 광 인터커넥트 시장을 둘러싸고 글로벌 빅테크와 K-반도체 진영의 주도권 쟁탈전이 본격화되고 있습니다.", "beginner_qna": {"question": "‘빛의 반도체’라니 이름부터 SF 영화 같은데요, 구리 전선 대신 빛으로 신호를 보낸다는 게 왜 그렇게 중요한 기술인가요?", "answer": "하하, 꽉 막힌 퇴근길 8차선 고속도로에 일반 자동차 대신 순간이동 광선 열차를 투입했다고 상상해 보세요! 지금 AI 데이터센터는 전선이 너무 뜨거워지고 전기를 하마처럼 먹어서 병목현상이 생기는데, 전자가 아니라 빛(광자)으로 데이터를 쏘면 속도는 엄청 빠르고 전력은 획기적으로 아낄 수 있거든요.", "followup_question": "아하, 전기 먹는 하마인 데이터센터의 열을 식혀줄 구원투수군요! 그럼 스마트폰 만드는 애플이 왜 이런 기반 기술까지 직접 만드는 걸까요?"}, "economic_meaning": "자체 AI 클라우드 인프라의 전력 비용을 줄이고 엔비디아 의존도를 낮추기 위한 치밀한 독자 생존 전략이에요. 향후 삼성전자와 SK하이닉스 같은 국내 메모리 강자들과의 패키징 협력이나 표준 선점 경쟁이 훨씬 치열해질 전망입니다.", "key_terms": ["실리콘 포토닉스", "광 인터커넥트"], "fact_summary": "애플이 AI 데이터센터의 전력 소모를 획기적으로 줄여줄 실리콘 포토닉스 기술 개발에 직접 뛰어들었습니다. 차세대 51조 원 규모 광 인터커넥트 시장을 둘러싸고 글로벌 빅테크와 K-반도체 진영의 주도권 쟁탈전이 본격화되고 있습니다."}, {"id": 4, "theme_id": "theme_1", "is_deep_dive": false, "category": "국내 경제/기업", "title": "KB증권 “내년 D램값 40%·낸드 30% 급등 전망”…메모리 슈퍼사이클 재점화", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008855055&plink=RSSLINK&cooper=RSSREADER", "summary": "KB증권은 AI 서버 확충에 따른 타이트한 공급 여파로 내년 삼성전자와 SK하이닉스의 D램 판가가 40% 이상 치솟을 것으로 내다봤습니다. 낸드플래시 역시 30%가량 반등하며 메모리 반도체의 실적 눈높이가 대폭 상향되고 있습니다.", "beginner_qna": {"question": "선배님, D램 가격이 40%나 오른다면 메모리 반도체 겨울론은 이제 완전히 끝나고 활활 타오르는 봄이 온 건가요?", "answer": "음... 마치 제철을 맞은 딸기 농가에 전국 특급 호텔들이 한꺼번에 납품해달라고 줄을 서서 경매가가 천정부지로 뛰는 격이에요! 일반 PC용 반도체는 조용하지만, 고성능 HBM과 기업용 SSD 주문이 폭주하면서 공장이 쉴 새 없이 돌아가고 있거든요.", "followup_question": "와, 그러면 반도체 기업들 실적 잔치가 열리는 셈인데, 우리 같은 개인 투자자들은 어디에 주목해야 할까요?"}, "economic_meaning": "단순 물량 증가를 넘어 평균판매단가(ASP)가 크게 뛰면 기업의 영업이익률이 드라마틱하게 개선돼요. 다만 전방 IT 세트 기기 수요가 동반 회복되지 않는다면 서버 시장 편중 리스크가 생길 수 있으니 분산 관점이 필요합니다.", "key_terms": ["평균판매단가(ASP)", "메모리 슈퍼사이클"], "fact_summary": "KB증권은 AI 서버 확충에 따른 타이트한 공급 여파로 내년 삼성전자와 SK하이닉스의 D램 판가가 40% 이상 치솟을 것으로 내다봤습니다. 낸드플래시 역시 30%가량 반등하며 메모리 반도체의 실적 눈높이가 대폭 상향되고 있습니다."}, {"id": 5, "theme_id": "theme_1", "is_deep_dive": false, "category": "국내 경제/기업", "title": "한 상자에 10억 원…인천 영종 물류센터, 반도체 특수 화물로 ‘불야성’", "source": "매일경제", "url": "https://www.mk.co.kr/news/business/12213796", "summary": "인천 영종 아레나스 물류센터에서는 무게 10kg 남짓의 라면 박스 크기 반도체 화물이 10억 원을 호가하며 분기 말 수출길에 오르고 있습니다. 첨단 고부가가치 칩의 항공 수출이 급증하며 한국 수출 전진기지로서의 위상을 보여줍니다.", "beginner_qna": {"question": "세상에, 라면 박스 하나 크기인데 집 한 채 값인 10억이라니 손이 덜덜 떨릴 것 같아요! 도대체 안에 뭐가 들었길래 이렇게 비싼 건가요?", "answer": "하하, 맞아요 지민님! 손바닥만 한 다이아몬드 수십 개를 아주 정교하게 포장해서 옮기는 것과 똑같아요. 전 세계 빅테크들이 목말라하는 초미세 첨단 AI 반도체 칩들이 빼곡하게 압축돼 들어가 있어서 부피는 작아도 가치는 어마어마한 거죠.", "followup_question": "헐, 정말 작지만 강한 K-반도체의 진면목이네요! 이런 초고가 화물이 늘어나면 항공 물류나 공항 경제에도 꽤 큰 보탬이 되겠어요?"}, "economic_meaning": "그렇습니다! 과거 컨테이너선으로 실어나르던 중후장대 수출 구조에서 초고부가가치 항공 운송 중심으로 산업 패러다임이 진화했다는 증거예요. 특수 보안 운송과 콜드체인 물류 생태계 전반의 수익성을 끌어올리는 긍정적 효과가 큽니다.", "key_terms": ["초고부가가치 화물", "항공 물류"], "fact_summary": "인천 영종 아레나스 물류센터에서는 무게 10kg 남짓의 라면 박스 크기 반도체 화물이 10억 원을 호가하며 분기 말 수출길에 오르고 있습니다. 첨단 고부가가치 칩의 항공 수출이 급증하며 한국 수출 전진기지로서의 위상을 보여줍니다."}, {"id": 6, "theme_id": "theme_2", "is_deep_dive": true, "category": "금융/금리/환율", "title": "코스피, 4%대 급락 출발에 매도 사이드카 발동…‘5천피’ 붕괴 충격", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008855620&plink=RSSLINK&cooper=RSSREADER", "summary": "간밤 뉴욕 증시 급락 여파로 코스피가 장 초반 4% 넘게 폭락하며 5,000선이 깨지고 프로그램 매도 호가 효력이 일시 정지되는 사이드카가 발동됐습니다. 기술주 밸류에이션 부담과 차익 실현 매물이 쏟아지며 아시아 증시 전반에 패닉이 번졌습니다.", "beginner_qna": {"question": "어? 선배님, 장 시작하자마자 사이드카가 울렸다는 알림이 뜨던데, 사이드카가 정확히 무슨 브레이크 장치인가요?", "answer": "음... 쉽게 비유하자면요, 놀이공원 롤러코스터가 너무 가파르게 내리막을 질주해서 승객들이 비명을 지르니까 안전요원이 5분간 비상 제동 레버를 당겨 멈춰 세운 거예요! 시장 참여자들이 공포에 질려 뇌동매매를 하지 않도록 프로그램 매매를 잠깐 얼려두는 안전장치죠.", "followup_question": "아~ 너무 놀라지 말라고 숨 고를 틈을 강제로 주는 거군요! 그럼 이럴 때 개미 투자자들은 무조건 다 팔고 도망쳐야 하는 건가요?"}, "economic_meaning": "이럴 때일수록 펀더멘털과 심리를 냉정하게 구분해야 해요. 단기 과열에 따른 차익 실현인지, 구조적 경기 침체의 신호탄인지 확인하고 섣부른 추격 매도보다는 포트폴리오의 현금 비중을 점검하는 리스크 관리가 최우선입니다.", "key_terms": ["사이드카", "변동성 완화장치"], "fact_summary": "간밤 뉴욕 증시 급락 여파로 코스피가 장 초반 4% 넘게 폭락하며 5,000선이 깨지고 프로그램 매도 호가 효력이 일시 정지되는 사이드카가 발동됐습니다. 기술주 밸류에이션 부담과 차익 실현 매물이 쏟아지며 아시아 증시 전반에 패닉이 번졌습니다."}, {"id": 7, "theme_id": "theme_2", "is_deep_dive": false, "category": "금융/금리/환율", "title": "‘킹달러’에도 맷집 생긴 원화…‘달러 강세=원화 약세’ 디커플링 공식 작동", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12214382", "summary": "미국 금리 긴축 우려로 글로벌 달러 인덱스가 19개월 만에 최고치로 치솟았음에도 원화 가치는 오히려 반등하는 이례적 차별화 장세가 나타났습니다. 견조한 반도체 수출 대금 유입과 외환 건전성이 원화의 든든한 방파제 역할을 하고 있습니다.", "beginner_qna": {"question": "선배님, 보통 달러가 천하무적으로 강해지면 원화는 힘없이 뚝뚝 떨어지는 게 공식 아니었나요? 이번엔 왜 원화가 잘 버티는 거죠?", "answer": "하하, 맞아요 지민님! 보통은 동네에 엄청 힘센 골목대장(달러)이 오면 다들 기가 죽는데, 우리 집 지갑에 반도체 팔아 벌어온 달러 현찰이 두둑하게 쌓여 있으니 기죽지 않고 당당하게 맞서고 있는 형국이에요! 수출 흑자로 들어오는 달러 공급이 원화 가치를 단단히 받쳐주고 있는 거죠.", "followup_question": "오, 벌어둔 달러가 든든한 맷집이 되어줬군요! 그럼 환율이 안정되면 수입 물가나 해외 직구족들에게도 좀 숨통이 트이겠네요?"}, "economic_meaning": "그렇죠! 환율이 안정되면 수입 원자재 가격 안정으로 이어져 가계 실질 생활비 절감 효과가 나타납니다. 기업 입장에서도 외화 부채 환산 손실 부담을 덜어내 재무 건전성을 지키는 데 큰 힘이 됩니다.", "key_terms": ["킹달러 디커플링", "외환 건전성"], "fact_summary": "미국 금리 긴축 우려로 글로벌 달러 인덱스가 19개월 만에 최고치로 치솟았음에도 원화 가치는 오히려 반등하는 이례적 차별화 장세가 나타났습니다. 견조한 반도체 수출 대금 유입과 외환 건전성이 원화의 든든한 방파제 역할을 하고 있습니다."}, {"id": 8, "theme_id": "theme_2", "is_deep_dive": false, "category": "금융/금리/환율", "title": "“주식 대신 안전지대로”…5대 은행 예금 39조 원 폭증·파킹통장 머니무브", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12214375", "summary": "주식시장 변동성이 극대화되면서 투자자예탁금이 55조 원 급감한 반면 5대 시중은행 정기예금에는 39조 원이 쏟아져 들어왔습니다. 2억 원 한도의 연 3%대 저축은행 파킹통장 등 확정금리형 안전 피난처로 뭉칫돈이 빠르게 이동하고 있습니다.", "beginner_qna": {"question": "주식 시장에서 돈을 빼서 은행 예금이나 파킹통장으로 다들 도망가고 있다는데, 왜 주저 없이 현금으로 묶어두는 걸까요?", "answer": "음... 밖에서 거센 태풍이 몰아치고 번개가 치니까 무리해서 항해하기보다는 배를 항구에 정박시키고 따뜻한 쉘터로 들어간 격이에요! 원금을 잃지 않으면서도 하루만 맡겨도 3%대 이자를 주는 파킹통장처럼, 언제든 기회를 노릴 수 있는 대기 자금 전략을 펴는 거죠.", "followup_question": "아~ 잃지 않는 게 최고의 수익이라는 말이 실감 나네요! 그럼 직장인 입장에선 지금 무리하게 주식 물타기보단 파킹통장이 나은 선택일까요?"}, "economic_meaning": "변동성 장세에서는 방어력이 곧 공격력이에요. 고금리 예금이나 파킹통장에 비상 자금을 확보해 두면 증시가 바닥을 다질 때 매수 기회를 잡을 수 있는 실탄이 되므로 자산 배분의 기본으로 삼을 만합니다.", "key_terms": ["머니무브", "파킹통장"], "fact_summary": "주식시장 변동성이 극대화되면서 투자자예탁금이 55조 원 급감한 반면 5대 시중은행 정기예금에는 39조 원이 쏟아져 들어왔습니다. 2억 원 한도의 연 3%대 저축은행 파킹통장 등 확정금리형 안전 피난처로 뭉칫돈이 빠르게 이동하고 있습니다."}, {"id": 9, "theme_id": "theme_2", "is_deep_dive": false, "category": "글로벌 거시/빅테크", "title": "뉴욕 증시 일제 하락·VIX 공포지수 18% 폭등…기술주 밸류에이션 경고등", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008854821&plink=RSSLINK&cooper=RSSREADER", "summary": "뉴욕 3대 지수가 2% 이상 동반 하락하며 나스닥 24,000선이 무너졌고 시장 변동성을 나타내는 VIX 지수는 18% 폭등했습니다. 빅테크 실적 기대감 선반영에 따른 피로감과 단기 밸류에이션 고평가 논란이 투심을 짓눌렀습니다.", "beginner_qna": {"question": "선배님, 뉴스에서 VIX가 18%나 폭등했다고 난리인데, 이 VIX 지수가 왜 월가의 공포지수라고 불리는 건가요?", "answer": "하하, 병원에 가면 환자 심장박동수를 재서 위급 상황을 알리는 모니터 있잖아요? VIX는 투자자들의 불안과 공포 수치를 재는 심장박동기 같은 거예요! 이 숫자가 치솟았다는 건 트레이더들이 미래 하락에 대비해 풋옵션 같은 보험 상품을 미친 듯이 사들였다는 뜻이랍니다.", "followup_question": "어우, 듣기만 해도 투자자들의 떨리는 심장 소리가 들리는 것 같네요! 이 미국발 공포가 우리 시장에는 언제까지 영향을 미칠까요?"}, "economic_meaning": "글로벌 증시의 풍향계 역할을 하는 뉴욕 시장의 조정은 외국인 자금 이탈을 자극해 신흥국 증시를 흔들 수 있어요. 하지만 단기 공포로 인한 급락은 우량 기술주를 합리적 가격에 담을 수 있는 밸류에이션 정상화 과정이기도 합니다.", "key_terms": ["VIX 공포지수", "기술주 밸류에이션"], "fact_summary": "뉴욕 3대 지수가 2% 이상 동반 하락하며 나스닥 24,000선이 무너졌고 시장 변동성을 나타내는 VIX 지수는 18% 폭등했습니다. 빅테크 실적 기대감 선반영에 따른 피로감과 단기 밸류에이션 고평가 논란이 투심을 짓눌렀습니다."}, {"id": 10, "theme_id": "theme_2", "is_deep_dive": false, "category": "국내 경제/기업", "title": "카카오 김범수, ‘SM 시세조종’ 의혹 2심도 무죄 판결…사법 리스크 해소 국면", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008855396&plink=RSSLINK&cooper=RSSREADER", "summary": "SM엔터테인먼트 인수 과정에서 시세조종을 지시·공모했다는 혐의를 받던 김범수 카카오 창업자가 1심에 이어 항소심에서도 무죄를 선고받았습니다. 2년 넘게 카카오의 발목을 잡았던 경영 족쇄가 풀리며 신사업 드라이브가 탄력을 받을 전망입니다.", "beginner_qna": {"question": "선배님, 카카오 창업자가 2심에서도 무죄를 받았다는데, 법원이 왜 무죄라고 판단한 거고 왜 이렇게 큰 뉴스인가요?", "answer": "음... 쉽게 말해 치열한 아파트 경매 입찰 경쟁에서 정상적인 자금으로 매수에 나선 것이지, 시장을 속이려는 불법 작전이나 담합으로 보기엔 증거가 부족하다고 법원이 판단한 거예요! 그룹의 총수가 구속 위기에서 완전히 벗어났으니, 멈춰 섰던 의사결정 기관차가 다시 시동을 건 셈이죠.", "followup_question": "와, 카카오 주주분들은 정말 가슴을 쓸어내렸겠어요! 그럼 멈춰있던 카카오의 AI 신사업이나 해외 진출도 다시 속도를 내게 될까요?"}, "economic_meaning": "그렇죠! 가장 무거운 사법 리스크가 걷히면서 신규 M&A와 AI 투자 같은 과감한 자본 배치가 가능해졌어요. 다만 실추된 기업 지배구조 신뢰를 회복하고 본업의 플랫폼 수익성을 증명해야 하는 과제는 여전히 남아 있습니다.", "key_terms": ["사법 리스크", "지배구조 신뢰"], "fact_summary": "SM엔터테인먼트 인수 과정에서 시세조종을 지시·공모했다는 혐의를 받던 김범수 카카오 창업자가 1심에 이어 항소심에서도 무죄를 선고받았습니다. 2년 넘게 카카오의 발목을 잡았던 경영 족쇄가 풀리며 신사업 드라이브가 탄력을 받을 전망입니다."}, {"id": 11, "theme_id": "theme_3", "is_deep_dive": true, "category": "금융/금리/환율", "title": "사과 29%·돼지고기 13% 뚝…생산자물가 석 달 만에 0.1% 하락 반전", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12214218", "summary": "농림수산품 가격이 8.3% 급락하면서 10월 생산자물가지수가 전월 대비 0.1% 내리며 석 달 만에 하락세로 돌아섰습니다. 가을철 출하량 증가로 사과와 돼지고기 가격이 큰 폭으로 내리며 밥상물가 안정 기대감을 키웠습니다.", "beginner_qna": {"question": "잠깐만요 선배님! 생산자물가가 내렸다는 게 마트에서 우리가 사는 소비자물가랑은 어떻게 연결되는 건가요? 장바구니가 좀 가벼워지나요?", "answer": "하하, 지민님! 생산자물가는 도매시장이나 산지 출하 가격이라고 보면 돼요. 밭에서 사과 떼오는 도매가가 30% 가까이 뚝 떨어졌으니, 시차를 두고 동네 마트나 과일가게의 소매 판매대 가격표도 서서히 낮아지게 되는 징검다리 관계랍니다!", "followup_question": "아~ 도매가가 먼저 내렸으니 이제 우리 동네 마트 영수증도 가벼워질 차례군요! 그럼 인플레이션 걱정은 이제 완전히 덜어도 되는 걸까요?"}, "economic_meaning": "농산물은 한숨 돌렸지만 원유나 공산품 수입 단가는 여전히 불안해서 완전히 안심하긴 일러요. 그래도 밥상물가가 진정되면 가계의 가처분소득 여력이 생겨 내수 소비 진작에 긍정적인 마중물이 될 수 있습니다.", "key_terms": ["생산자물가지수(PPI)", "시차 효과"], "fact_summary": "농림수산품 가격이 8.3% 급락하면서 10월 생산자물가지수가 전월 대비 0.1% 내리며 석 달 만에 하락세로 돌아섰습니다. 가을철 출하량 증가로 사과와 돼지고기 가격이 큰 폭으로 내리며 밥상물가 안정 기대감을 키웠습니다."}, {"id": 12, "theme_id": "theme_3", "is_deep_dive": false, "category": "금융/금리/환율", "title": "5대 은행 가계대출 보름 만에 1조 원 폭증…연말 ‘대출 절벽’ 우려 현실화", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12213828", "summary": "총량 규제 완화 이후 5대 시중은행의 가계대출이 이달 들어 보름 만에 1조 원 넘게 급증하며 연간 한도 소진이 임박했습니다. 은행들이 연말 건전성 관리를 위해 우대금리를 축소하거나 주담대 취급을 걸어 잠그는 대출 보릿고개가 우려됩니다.", "beginner_qna": {"question": "어? 총량 규제 푼 지 얼마 안 된 것 같은데 보름 만에 1조 원이나 찼다고요? 연말에 잔금 치러야 하는 사람들은 대출 안 나오면 어떡해요?", "answer": "음... 마치 식당에서 오늘 준비한 한정 메뉴 100그릇 중 90그릇이 오전 점심시간에 다 팔려버려서, 저녁 손님들은 주문도 못 하고 쫓겨날 판인 상황이에요! 은행들도 1년 치 대출 한도 쿼터가 바닥나니까 문을 닫아걸기 시작한 거죠.", "followup_question": "헐, 정말 이사 앞두고 잔금 대출 계획했던 직장인들은 발등에 불이 떨어졌겠네요! 지금 대출이 필요한 분들은 어떻게 대비해야 할까요?"}, "economic_meaning": "주요 시중은행의 문턱이 높아지면 2금융권으로 풍선효과가 번지면서 대출 금리 부담이 커질 수 있어요. 연말 자금 계획이 있다면 하루라도 빨리 여러 금융기관의 한도와 사전 심사를 꼼꼼히 확인해 두는 기민함이 필수입니다.", "key_terms": ["가계대출 총량관리", "대출 절벽"], "fact_summary": "총량 규제 완화 이후 5대 시중은행의 가계대출이 이달 들어 보름 만에 1조 원 넘게 급증하며 연간 한도 소진이 임박했습니다. 은행들이 연말 건전성 관리를 위해 우대금리를 축소하거나 주담대 취급을 걸어 잠그는 대출 보릿고개가 우려됩니다."}, {"id": 13, "theme_id": "theme_3", "is_deep_dive": false, "category": "부동산/재테크", "title": "반포 현대 조합원당 평균 2.2억 원 ‘재초환 폭탄’ 통보…부동산 시장 긴장", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008854833&plink=RSSLINK&cooper=RSSREADER", "summary": "서울 서초구 반포 현대 재건축 아파트 조합원들에게 가구당 평균 2억 2천만 원대의 재건축초과이익부담금 예정액이 공식 통보됐습니다. 강남권 정비사업 단지마다 수억 원대 청구서가 현실화되며 재건축 시장의 셈법이 복잡해지고 있습니다.", "beginner_qna": {"question": "선배님, 재건축해서 새 아파트 받는 건 좋은데, 입주도 전에 현금으로 2억 넘는 돈을 세금처럼 내라니 이게 ‘재초환’ 제도 때문인가요?", "answer": "하하, 맞아요 지민님! 낡은 집을 부수고 새 아파트를 지어서 집값이 크게 뛰었을 때, 정상적인 집값 상승분과 공사비를 뺀 ‘초과 이익’의 최대 50%를 나라가 환수해 가는 제도예요. 로또 당첨금에서 세금을 떼듯 부동산 불로소득을 환수하겠다는 취지죠.", "followup_question": "우와, 2억 넘는 생돈을 마련해야 한다면 조합원들 부담이 엄청나겠어요! 그럼 이 부담금 때문에 다른 재건축 단지들도 사업을 미루게 될까요?"}, "economic_meaning": "정확한 지적이에요! 수억 원대 현금 부담은 조합원 갈등과 사업 지연을 유발해 서울 도심의 신규 주택 공급을 위축시키는 부작용을 낳을 수 있습니다. 공급 부족 우려와 맞물려 신축 아파트의 희소성이 더 부각될 수도 있죠.", "key_terms": ["재건축초과이익환수제", "정비사업 분담금"], "fact_summary": "서울 서초구 반포 현대 재건축 아파트 조합원들에게 가구당 평균 2억 2천만 원대의 재건축초과이익부담금 예정액이 공식 통보됐습니다. 강남권 정비사업 단지마다 수억 원대 청구서가 현실화되며 재건축 시장의 셈법이 복잡해지고 있습니다."}, {"id": 14, "theme_id": "theme_3", "is_deep_dive": false, "category": "부동산/재테크", "title": "서울 아파트값 5주 연속 상승세 둔화 ‘보합’ 근접…한강벨트도 관망세", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008855258&plink=RSSLINK&cooper=RSSREADER", "summary": "서울 주간 아파트 매매가격 상승률이 0.03%로 축소되며 5주째 오름폭이 둔화해 사실상 보합권에 진입했습니다. 대출 규제 압박과 매수자들의 관망세가 짙어지며 마포·용산·성동 등 이른바 한강벨트마저 숨 고르기 양상을 보이고 있습니다.", "beginner_qna": {"question": "그 뜨겁던 서울 아파트 시장이 갑자기 조용해지면서 상승세가 멈칫하고 있다는데, 시장 열기가 왜 이렇게 빠르게 식은 건가요?", "answer": "음... 쉽게 비유하자면요, 난로에 장작(주택담보대출)을 계속 넣어줘야 불길이 활활 타오르는데, 정부가 대출 규제로 장작 공급을 딱 끊어버린 격이에요! 집을 사고 싶어도 돈 빌리기가 어려우니 매수자들이 한 발 물러서서 눈치만 보고 있는 거죠.", "followup_question": "아~ 대출 장작이 끊겨서 불길이 잦아들었군요! 그럼 무주택 실수요자들은 지금 집을 사야 할까요, 아니면 더 기다려야 할까요?"}, "economic_meaning": "거래량이 동반되지 않은 보합세는 하락 전환의 전조일 수도 있고 일시적 숨 고르기일 수도 있어요. 금리 추이와 공급 지표를 확인하며 무리한 영끌보다는 경매나 급매물 중심의 보수적인 접근이 유효한 시점입니다.", "key_terms": ["거래 절벽", "가격 보합세"], "fact_summary": "서울 주간 아파트 매매가격 상승률이 0.03%로 축소되며 5주째 오름폭이 둔화해 사실상 보합권에 진입했습니다. 대출 규제 압박과 매수자들의 관망세가 짙어지며 마포·용산·성동 등 이른바 한강벨트마저 숨 고르기 양상을 보이고 있습니다."}, {"id": 15, "theme_id": "theme_3", "is_deep_dive": false, "category": "금융/금리/환율", "title": "월급 470만 원 같아도 빚 갚느라…중산층 저축 격차 53만 원 벌어졌다", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12213848", "summary": "비슷한 470만 원 소득의 중산층 가구라도 매달 대출 원리금을 갚는지 여부에 따라 월 저축액이 53만 원이나 차이 나는 것으로 나타났습니다. 부채를 보유한 가구의 예·적금 납입액은 무부채 가구보다 36% 적어 자산 형성 사다리가 흔들리고 있습니다.", "beginner_qna": {"question": "선배님, 똑같이 열심히 일해서 470만 원을 벌어도 빚이 있냐 없냐로 매달 저축이 50만 원 넘게 차이 난다니 너무 뼈아픈데요?", "answer": "하하, 맞아요 지민님! 똑같은 배기량의 자동차인데 한쪽은 트렁크에 무거운 납덩어리(대출 이자)를 가득 싣고 달리는 것과 똑같아요. 숨만 쉬어도 매달 나가는 원리금 때문에 저축할 종잣돈이 메말라버리는 ‘부채의 덫’에 걸린 셈이죠.", "followup_question": "아... 매달 50만 원이면 1년이면 600만 원인데 복리로 굴리면 엄청난 차이잖아요! 그럼 직장인들은 빚부터 무조건 갚는 게 정답인가요?"}, "economic_meaning": "그렇습니다! 고금리 환경에서는 확실한 투자 수익률을 내기 어려운 만큼, 빚을 갚아 확정 이자 비용을 줄이는 것이 가장 확실한 무위험 재테크예요. 원리금 상환액을 줄여 현금 흐름을 회복하는 것이 자산 관리의 제1원칙입니다.", "key_terms": ["원리금 상환 부담(DSR)", "현금 흐름"], "fact_summary": "비슷한 470만 원 소득의 중산층 가구라도 매달 대출 원리금을 갚는지 여부에 따라 월 저축액이 53만 원이나 차이 나는 것으로 나타났습니다. 부채를 보유한 가구의 예·적금 납입액은 무부채 가구보다 36% 적어 자산 형성 사다리가 흔들리고 있습니다."}, {"id": 16, "theme_id": "theme_4", "is_deep_dive": false, "category": "국내 경제/기업", "title": "비수도권 AI 데이터센터 전력 규제 푼다…50MW까지 전력평가 면제", "source": "연합뉴스TV", "url": "https://www.yonhapnewstv.co.kr/news/AKR20261120115127TJi", "summary": "과기정통부가 비수도권에 짓는 임대형 AI 데이터센터에 대해 50메가와트(MW)까지 전력계통영향평가를 면제하는 특별법 시행령을 입법 예고했습니다. 수도권 전력망 포화를 해소하고 지방으로 첨단 IT 인프라를 분산 유치하려는 파격 혜택입니다.", "beginner_qna": {"question": "지방에 AI 데이터센터를 지으면 전력 평가를 면제해 준다는데, 왜 이렇게 수도권을 피해서 지방으로 유치하려는 건가요?", "answer": "음... 서울 강남 도로에 대형 트럭 수백 대가 한꺼번에 쏟아져 나오면 도로가 마비되는 것처럼, 수도권 전력망은 이미 과부하 상태예요! 반면 지방에는 발전소는 많은데 송전선이 부족하니, 전기를 많이 쓰는 대형 데이터센터를 발전소 근처 지방으로 유도하려는 고육지책이죠.", "followup_question": "아~ 전기가 남아도는 산지로 공장을 옮기게 길을 터주는 거군요! 그럼 지방 일자리 창출이나 지역 경제 활성화에도 꽤 도움이 될까요?"}, "economic_meaning": "인프라 분산과 지역 균형 발전이라는 두 마리 토끼를 잡을 기회예요. 다만 데이터센터는 상주 고용 인원이 적은 편이라, 단순 유치를 넘어 지역 내 AI 스타트업 생태계와 연계해야 실질적인 경제 파급력을 극대화할 수 있습니다.", "key_terms": ["전력계통영향평가", "AI 데이터센터 분산"], "fact_summary": "과기정통부가 비수도권에 짓는 임대형 AI 데이터센터에 대해 50메가와트(MW)까지 전력계통영향평가를 면제하는 특별법 시행령을 입법 예고했습니다. 수도권 전력망 포화를 해소하고 지방으로 첨단 IT 인프라를 분산 유치하려는 파격 혜택입니다."}, {"id": 17, "theme_id": "theme_4", "is_deep_dive": false, "category": "국내 경제/기업", "title": "클로드에 풀게 했더니 세무사 시험 ‘만점’…고득점자 33배 폭증 논란", "source": "연합뉴스TV", "url": "https://www.yonhapnewstv.co.kr/news/MYH20261120111045pYz", "summary": "앤트로픽의 최신 AI 모델이 올해 세무사 1차 시험 회계학개론 문제를 100점 만점으로 풀어내 화제가 된 가운데, 90점 이상 고득점자가 전년 대비 33배 급증했습니다. 정부는 시험 감독을 강화하고 주관식 문제를 늘리는 등 부정행위 방지책 마련에 착수했습니다.", "beginner_qna": {"question": "선배님, 세무사 회계학 시험이 어렵기로 악명 높은데 AI가 100점 만점을 받았다니요? 게다가 실제 고득점자도 33배나 늘었다면서요?", "answer": "하하, 맞아요 지민님! 마치 사람이 계산기 두드리며 끙끙 앓고 있을 때, 슈퍼컴퓨터 두뇌를 가진 천재 조수가 옆에서 실시간으로 완벽한 답안지를 대신 써준 격이에요! AI의 문제 풀이 능력이 인간 전문가 수준을 가뿐히 뛰어넘었다는 결정적 증거죠.", "followup_question": "헐, 정말 부정행위 의심이 나올 법도 하네요! 이렇게 되면 앞으로 자격증 시험이나 대학 입시 방식도 완전히 바뀌어야 하지 않을까요?"}, "economic_meaning": "단순 지식 암기형 평가의 시대는 끝났다는 강력한 경고예요. 정부가 주관식을 늘리듯, 기업 채용과 자격 검정에서도 단순 문제 풀이가 아닌 윤리적 판단력과 복합적 문제 해결 능력을 검증하는 방향으로 전환될 것입니다.", "key_terms": ["AI 문제풀이 역량", "평가 제도 개편"], "fact_summary": "앤트로픽의 최신 AI 모델이 올해 세무사 1차 시험 회계학개론 문제를 100점 만점으로 풀어내 화제가 된 가운데, 90점 이상 고득점자가 전년 대비 33배 급증했습니다. 정부는 시험 감독을 강화하고 주관식 문제를 늘리는 등 부정행위 방지책 마련에 착수했습니다."}, {"id": 18, "theme_id": "theme_4", "is_deep_dive": false, "category": "국내 경제/기업", "title": "자녀 둔 워킹맘 고용률 66% ‘역대 최고’…육아로 인한 경단녀 비중은 여전", "source": "SBS 뉴스", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008854831&plink=RSSLINK&cooper=RSSREADER", "summary": "18세 미만 자녀를 둔 워킹맘의 고용률이 66%를 넘어서며 통계 작성 이래 역대 최고치를 기록했습니다. 하지만 경력단절 여성 중 절반 이상이 여전히 육아 부담을 원인으로 꼽아 돌봄 인프라 확충이 시급한 과제로 지목됐습니다.", "beginner_qna": {"question": "아이 키우면서 일하는 워킹맘이 3명 중 2명이라니 대단한데요! 경제활동에 많이 참여하는 건 좋은데 육아 현실은 여전히 팍팍한가 봐요?", "answer": "음... 직장이라는 일터와 집이라는 가사 노동터, 두 개의 풀타임 직업을 동시에 뛰며 줄타기를 하는 슈퍼우먼들이 그만큼 늘어난 거예요! 생활비 부담 때문에 일을 놓을 순 없는데, 믿고 맡길 돌봄 시스템은 여전히 턱없이 부족한 현실을 보여주죠.", "followup_question": "맞아요, 제 주변 맞벌이 동료들도 아이 맡길 데 없어서 늘 발을 동동 구르더라고요! 기업과 사회가 이걸 풀어주지 않으면 저출생 극복도 어렵겠죠?"}, "economic_meaning": "여성 경제활동 참가는 생산가능인구 절벽을 막아줄 핵심 열쇠예요. 하지만 유연근무제나 돌봄 인프라가 뒷받침되지 않으면 조기 퇴직으로 이어져 기업의 숙련 노동력 손실과 국가 잠재성장률 하락이라는 악순환을 부르게 됩니다.", "key_terms": ["워킹맘 고용률", "돌봄 인프라"], "fact_summary": "18세 미만 자녀를 둔 워킹맘의 고용률이 66%를 넘어서며 통계 작성 이래 역대 최고치를 기록했습니다. 하지만 경력단절 여성 중 절반 이상이 여전히 육아 부담을 원인으로 꼽아 돌봄 인프라 확충이 시급한 과제로 지목됐습니다."}, {"id": 19, "theme_id": "theme_4", "is_deep_dive": false, "category": "국내 경제/기업", "title": "직장인 복지포인트는 세금 떼고 공무원은 ‘비과세’…조세 형평성 도마 위", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12214136", "summary": "회사에서 받는 복지포인트에 대해 민간 직장인은 근로소득세가 과세되는 반면 공무원은 비과세 혜택을 누리고 있어 형평성 논란이 확산되고 있습니다. 같은 복리후생 성격의 포인트를 두고 법원과 유권해석이 엇갈리며 조세 정의가 흔들리고 있습니다.", "beginner_qna": {"question": "잠깐만요 선배님! 똑같이 회사에서 지급받아 물건 사는 복지포인트인데 왜 일반 직장인 월급에선 세금을 떼고 공무원은 안 떼는 건가요?", "answer": "하하, 지민님이 화내실 만해요! 똑같이 식당에서 주는 식권인데, 직장인이 받으면 '월급의 일부니까 세금 내!'라고 하고, 공무원이 받으면 '단순한 복지 혜택이니 면제해 줄게'라며 잣대를 다르게 들이댄 격이거든요. 대법원 판결과 정부 유권해석이 엇갈려 생긴 촌극이에요.", "followup_question": "헐, 정말 직장인들 입장에선 '유리지갑만 봉이냐'는 소리가 절로 나오겠네요! 이거 법 개정이나 시정 조치가 곧 이뤄질 수 있을까요?"}, "economic_meaning": "조세 원칙의 핵심인 '공평 과세'에 대한 국민적 신뢰가 무너질 수 있는 민감한 사안이에요. 직장인들의 반발이 거세지고 있는 만큼 과세 기준을 통일하거나 비과세 한도를 합리적으로 재설정하는 세법 보완 논의가 불가피합니다.", "key_terms": ["복지포인트 과세", "조세 형평성"], "fact_summary": "회사에서 받는 복지포인트에 대해 민간 직장인은 근로소득세가 과세되는 반면 공무원은 비과세 혜택을 누리고 있어 형평성 논란이 확산되고 있습니다. 같은 복리후생 성격의 포인트를 두고 법원과 유권해석이 엇갈리며 조세 정의가 흔들리고 있습니다."}, {"id": 20, "theme_id": "theme_4", "is_deep_dive": false, "category": "국내 경제/기업", "title": "李대통령 “YS 금융실명제 결단처럼…주가조작·시세조종 엄단해 증시 신뢰 회복”", "source": "매일경제", "url": "https://www.mk.co.kr/news/economy/12214419", "summary": "이재명 대통령은 YS의 금융실명제 개혁을 계승해 주가조작과 불법 시세조종 행위를 자본시장에서 영구 퇴출하겠다는 강력한 척결 의지를 천명했습니다. 부당이득 환수와 원스트라이크 아웃제를 도입해 코리아 디스카운트를 근본적으로 해소하겠다는 방침입니다.", "beginner_qna": {"question": "대통령이 YS 금융실명제까지 소환하면서 주가조작을 완전히 뿌리 뽑겠다고 선언했는데, 우리 주식시장에 어떤 변화가 생길까요?", "answer": "음... 쉽게 비유하자면요, 동네 축구 경기장에 몰래 숨어들어 심판을 매수하고 파울을 일삼던 반칙 선수들을 평생 레드카드로 영구 퇴출시키겠다고 선언한 거예요! 물을 맑게 청소해야 진짜 큰손 투자자들과 외국인 자금이 믿고 들어올 수 있으니까요.", "followup_question": "아~ 룰을 엄격하게 지키게 해서 믿을 수 있는 시장을 만들겠다는 거군요! 그럼 개미 투자자들도 억울하게 피눈물 흘리는 일이 줄어들까요?"}, "economic_meaning": "자본시장의 투명성은 코스피 밸류에이션 리레이팅의 핵심 전제조건이에요. 불공정 거래에 대한 징벌적 손해배상과 철저한 단속이 자리 잡는다면 만성적인 코리아 디스카운트를 해소하고 증시의 체질을 튼튼하게 개선할 수 있습니다.", "key_terms": ["금융실명제 정신", "자본시장 신뢰 회복"], "fact_summary": "이재명 대통령은 YS의 금융실명제 개혁을 계승해 주가조작과 불법 시세조종 행위를 자본시장에서 영구 퇴출하겠다는 강력한 척결 의지를 천명했습니다. 부당이득 환수와 원스트라이크 아웃제를 도입해 코리아 디스카운트를 근본적으로 해소하겠다는 방침입니다."}], "closing_banter": [{"speaker": "지민", "text": "선배님, 오늘 삼성전자 인사부터 환율 디커플링, 장바구니 생산자물가까지 20개 뉴스를 훑고 나니까 경제 뉴스가 제 월급과 지갑에 어떻게 연결되는지 퍼즐이 딱 맞춰지는 기분이에요!"}, {"speaker": "현우", "text": "하하, 바로 그 맛에 경제를 공부하는 거죠! 시장이 출렁여도 흔들리지 않는 지혜를 챙기셨길 바라며, 활기차고 행복한 불금과 주말 맞이하시길 응원합니다!"}], "glossary": [{"term": "사이드카 (Sidecar)", "simple_def": "선물시장 급변 시 프로그램 매매 호가를 5분간 정지시켜 시장의 과열이나 패닉을 진정시키는 안전장치", "analogy": "놀이기구가 너무 빠르게 내달릴 때 안전요원이 비상 브레이크를 걸어 승객들이 숨을 고르게 해주는 안전장치"}, {"term": "실리콘 포토닉스 (Silicon Photonics)", "simple_def": "전기 신호 대신 빛(광자)을 이용해 칩과 칩 사이의 데이터를 초고속·저전력으로 전송하는 차세대 반도체 기술", "analogy": "꽉 막힌 구리선 도로 대신 빛의 속도로 질주하는 초고속 자기부상열차 전용 레일을 칩 위에 깔아주는 기술"}, {"term": "생산자물가지수 (PPI)", "simple_def": "국내 생산자가 시장에 출하하는 상품과 서비스의 종합적인 도매 가격 변동을 측정하는 물가 지표", "analogy": "마트 진열대에 가격표가 붙기 전, 산지 도매시장에서 거래되는 원가 성적표"}, {"term": "재건축초과이익환수제", "simple_def": "재건축 사업으로 발생한 조합원의 이익이 일정 기준을 넘을 때 초과분의 최대 50%를 국가가 부담금으로 걷는 제도", "analogy": "낡은 집을 새집으로 바꿔 번 돈 중 정상 상승분을 뺀 대박 수익의 일부를 세금처럼 나라에 환수하는 제도"}, {"term": "VIX 공포지수", "simple_def": "S&P 500 옵션 가격을 바탕으로 향후 30일간 시장이 예상하는 변동성과 투자자들의 불안 심리를 나타내는 지표", "analogy": "금융시장 환자가 공포와 불안을 느낄 때 가파르게 치솟는 월가의 심장박동수 모니터"}], "dialogue": [{"speaker": "지민", "theme_id": "opening", "text": "선배님, 드디어 기다리고 기다리던 금요일 아침입니다! 그런데 오늘 아침 경제 뉴스 헤드라인을 보니까 아주 롤러코스터를 탄 것처럼 어질어질하더라고요?"}, {"speaker": "현우", "theme_id": "opening", "text": "하하, 맞아요 지민님! 오늘 증시도 요동치고 삼성전자 인사부터 장바구니 물가까지 굵직한 소식이 쏟아졌거든요. 따뜻한 모닝커피 한 잔 손에 쥐고, 출근길에 가볍게 핵심만 쏙쏙 짚어보자고요!"}, {"speaker": "지민", "theme_id": "theme_1", "text": "선배님, 오늘 아침 테크 판이 아주 뜨거운데 삼성전자 인사 소식부터 눈에 확 들어오더라고요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "네, 맞아요. 거대한 항공모함 같은 대기업들이 급변하는 인공지능 파도에 맞춰 조타수를 새로 정비하고 미래 먹거리를 선점하려는 치열한 승부수를 던진 셈이죠."}, {"speaker": "지민", "theme_id": "theme_1", "text": "선배님, 삼성전자가 큰 틀의 대표는 그대로 두면서 사업부장 겸직을 풀었다는데, 이게 회사 안에서 구체적으로 뭐가 달라진 건가요? 총사령관 자리는 그대로인 거잖아요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "하하, 지민님! 대형 레스토랑으로 비유하자면요, 총괄 지배인이 매장 전체 경영도 챙기면서 주방장 모자까지 쓰고 메인 요리까지 직접 만들다가, 이번에 각 파트 전문 셰프들에게 칼자루를 온전히 넘겨준 셈이에요! 전영현, 노태문 부회장은 파운드리나 차세대 로봇 같은 미래 밑그림을 그리고, 메모리와 갤럭시폰 현장은 실무 사장들이 책임지고 전력 질주하게 만든 거죠."}, {"speaker": "지민", "theme_id": "theme_1", "text": "아~ 지배인은 전체 매장 확장에 집중하고 주방은 전문 셰프가 꽉 잡는 거군요! 그럼 이게 우리 주식 투자자나 IT 업계 판도에는 어떤 신호로 해석되나요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "그렇죠! HBM 같은 AI 반도체 주도권 싸움에서 한 치의 오차도 허용하지 않겠다는 강력한 위기의식의 발로예요. 의사결정 단계를 한층 좁혔기 때문에 시장의 급변하는 고객사 요구에 대응하는 속도가 훨씬 빨라질 나비효과를 기대할 수 있습니다."}, {"speaker": "지민", "theme_id": "theme_1", "text": "연간 수출 1조 달러라니 숫자가 너무 커서 실감이 잘 안 나는데, 이게 글로벌 시장에서 얼마나 대단한 위치에 오른 건가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "음... 쉽게 비유하자면요, 전 세계라는 거대한 글로벌 백화점에서 미국, 중국, 독일이라는 거물급 매장에 이어 한국 매장이 4번째로 큰 매출 전표를 찍은 거나 다름없어요! 한때 아시아 제조업의 맹주였던 일본조차 밟아보지 못한 꿈의 고지랍니다."}, {"speaker": "지민", "theme_id": "theme_1", "text": "우와, 일본도 못 가본 길이라니 국뽕이 차오르네요! 그런데 요즘 보호무역주의가 심한데 이 기세가 우리 월급봉투까지 쭉 이어질 수 있을까요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "바로 그 지점이 핵심이에요. 수출 1조 달러는 제조업 경쟁력을 증명한 훈장이지만, 특정 품목 의존도를 낮추지 못하면 글로벌 통상 압박 때 충격이 커질 수 있거든요. 중견·중소기업 낙수효과로 이어져야 내수 경기와 양질의 일자리가 탄탄해집니다."}, {"speaker": "지민", "theme_id": "theme_1", "text": "‘빛의 반도체’라니 이름부터 SF 영화 같은데요, 구리 전선 대신 빛으로 신호를 보낸다는 게 왜 그렇게 중요한 기술인가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "하하, 꽉 막힌 퇴근길 8차선 고속도로에 일반 자동차 대신 순간이동 광선 열차를 투입했다고 상상해 보세요! 지금 AI 데이터센터는 전선이 너무 뜨거워지고 전기를 하마처럼 먹어서 병목현상이 생기는데, 전자가 아니라 빛(광자)으로 데이터를 쏘면 속도는 엄청 빠르고 전력은 획기적으로 아낄 수 있거든요."}, {"speaker": "지민", "theme_id": "theme_1", "text": "아하, 전기 먹는 하마인 데이터센터의 열을 식혀줄 구원투수군요! 그럼 스마트폰 만드는 애플이 왜 이런 기반 기술까지 직접 만드는 걸까요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "자체 AI 클라우드 인프라의 전력 비용을 줄이고 엔비디아 의존도를 낮추기 위한 치밀한 독자 생존 전략이에요. 향후 삼성전자와 SK하이닉스 같은 국내 메모리 강자들과의 패키징 협력이나 표준 선점 경쟁이 훨씬 치열해질 전망입니다."}, {"speaker": "지민", "theme_id": "theme_1", "text": "선배님, D램 가격이 40%나 오른다면 메모리 반도체 겨울론은 이제 완전히 끝나고 활활 타오르는 봄이 온 건가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "음... 마치 제철을 맞은 딸기 농가에 전국 특급 호텔들이 한꺼번에 납품해달라고 줄을 서서 경매가가 천정부지로 뛰는 격이에요! 일반 PC용 반도체는 조용하지만, 고성능 HBM과 기업용 SSD 주문이 폭주하면서 공장이 쉴 새 없이 돌아가고 있거든요."}, {"speaker": "지민", "theme_id": "theme_1", "text": "와, 그러면 반도체 기업들 실적 잔치가 열리는 셈인데, 우리 같은 개인 투자자들은 어디에 주목해야 할까요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "단순 물량 증가를 넘어 평균판매단가(ASP)가 크게 뛰면 기업의 영업이익률이 드라마틱하게 개선돼요. 다만 전방 IT 세트 기기 수요가 동반 회복되지 않는다면 서버 시장 편중 리스크가 생길 수 있으니 분산 관점이 필요합니다."}, {"speaker": "지민", "theme_id": "theme_1", "text": "세상에, 라면 박스 하나 크기인데 집 한 채 값인 10억이라니 손이 덜덜 떨릴 것 같아요! 도대체 안에 뭐가 들었길래 이렇게 비싼 건가요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "하하, 맞아요 지민님! 손바닥만 한 다이아몬드 수십 개를 아주 정교하게 포장해서 옮기는 것과 똑같아요. 전 세계 빅테크들이 목말라하는 초미세 첨단 AI 반도체 칩들이 빼곡하게 압축돼 들어가 있어서 부피는 작아도 가치는 어마어마한 거죠."}, {"speaker": "지민", "theme_id": "theme_1", "text": "헐, 정말 작지만 강한 K-반도체의 진면목이네요! 이런 초고가 화물이 늘어나면 항공 물류나 공항 경제에도 꽤 큰 보탬이 되겠어요?"}, {"speaker": "현우", "theme_id": "theme_1", "text": "그렇습니다! 과거 컨테이너선으로 실어나르던 중후장대 수출 구조에서 초고부가가치 항공 운송 중심으로 산업 패러다임이 진화했다는 증거예요. 특수 보안 운송과 콜드체인 물류 생태계 전반의 수익성을 끌어올리는 긍정적 효과가 큽니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "어휴, 주식 창 열어봤다가 파란 불이 번쩍여서 깜짝 놀랐는데, 시장이 왜 이렇게 출렁이는 거예요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "글로벌 기술주들이 숨 고르기에 들어가면서 투자자들의 심리가 얼어붙었거든요. 비가 쏟아질 때 우산을 찾는 것처럼 돈의 흐름이 급변하고 있는 맥락을 봐야 합니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "어? 선배님, 장 시작하자마자 사이드카가 울렸다는 알림이 뜨던데, 사이드카가 정확히 무슨 브레이크 장치인가요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "음... 쉽게 비유하자면요, 놀이공원 롤러코스터가 너무 가파르게 내리막을 질주해서 승객들이 비명을 지르니까 안전요원이 5분간 비상 제동 레버를 당겨 멈춰 세운 거예요! 시장 참여자들이 공포에 질려 뇌동매매를 하지 않도록 프로그램 매매를 잠깐 얼려두는 안전장치죠."}, {"speaker": "지민", "theme_id": "theme_2", "text": "아~ 너무 놀라지 말라고 숨 고를 틈을 강제로 주는 거군요! 그럼 이럴 때 개미 투자자들은 무조건 다 팔고 도망쳐야 하는 건가요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "이럴 때일수록 펀더멘털과 심리를 냉정하게 구분해야 해요. 단기 과열에 따른 차익 실현인지, 구조적 경기 침체의 신호탄인지 확인하고 섣부른 추격 매도보다는 포트폴리오의 현금 비중을 점검하는 리스크 관리가 최우선입니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "선배님, 보통 달러가 천하무적으로 강해지면 원화는 힘없이 뚝뚝 떨어지는 게 공식 아니었나요? 이번엔 왜 원화가 잘 버티는 거죠?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "하하, 맞아요 지민님! 보통은 동네에 엄청 힘센 골목대장(달러)이 오면 다들 기가 죽는데, 우리 집 지갑에 반도체 팔아 벌어온 달러 현찰이 두둑하게 쌓여 있으니 기죽지 않고 당당하게 맞서고 있는 형국이에요! 수출 흑자로 들어오는 달러 공급이 원화 가치를 단단히 받쳐주고 있는 거죠."}, {"speaker": "지민", "theme_id": "theme_2", "text": "오, 벌어둔 달러가 든든한 맷집이 되어줬군요! 그럼 환율이 안정되면 수입 물가나 해외 직구족들에게도 좀 숨통이 트이겠네요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "그렇죠! 환율이 안정되면 수입 원자재 가격 안정으로 이어져 가계 실질 생활비 절감 효과가 나타납니다. 기업 입장에서도 외화 부채 환산 손실 부담을 덜어내 재무 건전성을 지키는 데 큰 힘이 됩니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "주식 시장에서 돈을 빼서 은행 예금이나 파킹통장으로 다들 도망가고 있다는데, 왜 주저 없이 현금으로 묶어두는 걸까요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "음... 밖에서 거센 태풍이 몰아치고 번개가 치니까 무리해서 항해하기보다는 배를 항구에 정박시키고 따뜻한 쉘터로 들어간 격이에요! 원금을 잃지 않으면서도 하루만 맡겨도 3%대 이자를 주는 파킹통장처럼, 언제든 기회를 노릴 수 있는 대기 자금 전략을 펴는 거죠."}, {"speaker": "지민", "theme_id": "theme_2", "text": "아~ 잃지 않는 게 최고의 수익이라는 말이 실감 나네요! 그럼 직장인 입장에선 지금 무리하게 주식 물타기보단 파킹통장이 나은 선택일까요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "변동성 장세에서는 방어력이 곧 공격력이에요. 고금리 예금이나 파킹통장에 비상 자금을 확보해 두면 증시가 바닥을 다질 때 매수 기회를 잡을 수 있는 실탄이 되므로 자산 배분의 기본으로 삼을 만합니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "선배님, 뉴스에서 VIX가 18%나 폭등했다고 난리인데, 이 VIX 지수가 왜 월가의 공포지수라고 불리는 건가요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "하하, 병원에 가면 환자 심장박동수를 재서 위급 상황을 알리는 모니터 있잖아요? VIX는 투자자들의 불안과 공포 수치를 재는 심장박동기 같은 거예요! 이 숫자가 치솟았다는 건 트레이더들이 미래 하락에 대비해 풋옵션 같은 보험 상품을 미친 듯이 사들였다는 뜻이랍니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "어우, 듣기만 해도 투자자들의 떨리는 심장 소리가 들리는 것 같네요! 이 미국발 공포가 우리 시장에는 언제까지 영향을 미칠까요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "글로벌 증시의 풍향계 역할을 하는 뉴욕 시장의 조정은 외국인 자금 이탈을 자극해 신흥국 증시를 흔들 수 있어요. 하지만 단기 공포로 인한 급락은 우량 기술주를 합리적 가격에 담을 수 있는 밸류에이션 정상화 과정이기도 합니다."}, {"speaker": "지민", "theme_id": "theme_2", "text": "선배님, 카카오 창업자가 2심에서도 무죄를 받았다는데, 법원이 왜 무죄라고 판단한 거고 왜 이렇게 큰 뉴스인가요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "음... 쉽게 말해 치열한 아파트 경매 입찰 경쟁에서 정상적인 자금으로 매수에 나선 것이지, 시장을 속이려는 불법 작전이나 담합으로 보기엔 증거가 부족하다고 법원이 판단한 거예요! 그룹의 총수가 구속 위기에서 완전히 벗어났으니, 멈춰 섰던 의사결정 기관차가 다시 시동을 건 셈이죠."}, {"speaker": "지민", "theme_id": "theme_2", "text": "와, 카카오 주주분들은 정말 가슴을 쓸어내렸겠어요! 그럼 멈춰있던 카카오의 AI 신사업이나 해외 진출도 다시 속도를 내게 될까요?"}, {"speaker": "현우", "theme_id": "theme_2", "text": "그렇죠! 가장 무거운 사법 리스크가 걷히면서 신규 M&A와 AI 투자 같은 과감한 자본 배치가 가능해졌어요. 다만 실추된 기업 지배구조 신뢰를 회복하고 본업의 플랫폼 수익성을 증명해야 하는 과제는 여전히 남아 있습니다."}, {"speaker": "지민", "theme_id": "theme_3", "text": "월급날은 다가오는데 장바구니 물가나 은행 대출 소식은 우리 같은 평범한 직장인에게 제일 와닿잖아요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "그렇죠! 사과값은 조금 내렸다는데 연말 대출 문턱은 더 좁아지고 있어서, 내 가계부 보일러 온도를 어떻게 맞출지 꼼꼼하게 따져봐야 할 타이밍입니다."}, {"speaker": "지민", "theme_id": "theme_3", "text": "잠깐만요 선배님! 생산자물가가 내렸다는 게 마트에서 우리가 사는 소비자물가랑은 어떻게 연결되는 건가요? 장바구니가 좀 가벼워지나요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "하하, 지민님! 생산자물가는 도매시장이나 산지 출하 가격이라고 보면 돼요. 밭에서 사과 떼오는 도매가가 30% 가까이 뚝 떨어졌으니, 시차를 두고 동네 마트나 과일가게의 소매 판매대 가격표도 서서히 낮아지게 되는 징검다리 관계랍니다!"}, {"speaker": "지민", "theme_id": "theme_3", "text": "아~ 도매가가 먼저 내렸으니 이제 우리 동네 마트 영수증도 가벼워질 차례군요! 그럼 인플레이션 걱정은 이제 완전히 덜어도 되는 걸까요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "농산물은 한숨 돌렸지만 원유나 공산품 수입 단가는 여전히 불안해서 완전히 안심하긴 일러요. 그래도 밥상물가가 진정되면 가계의 가처분소득 여력이 생겨 내수 소비 진작에 긍정적인 마중물이 될 수 있습니다."}, {"speaker": "지민", "theme_id": "theme_3", "text": "어? 총량 규제 푼 지 얼마 안 된 것 같은데 보름 만에 1조 원이나 찼다고요? 연말에 잔금 치러야 하는 사람들은 대출 안 나오면 어떡해요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "음... 마치 식당에서 오늘 준비한 한정 메뉴 100그릇 중 90그릇이 오전 점심시간에 다 팔려버려서, 저녁 손님들은 주문도 못 하고 쫓겨날 판인 상황이에요! 은행들도 1년 치 대출 한도 쿼터가 바닥나니까 문을 닫아걸기 시작한 거죠."}, {"speaker": "지민", "theme_id": "theme_3", "text": "헐, 정말 이사 앞두고 잔금 대출 계획했던 직장인들은 발등에 불이 떨어졌겠네요! 지금 대출이 필요한 분들은 어떻게 대비해야 할까요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "주요 시중은행의 문턱이 높아지면 2금융권으로 풍선효과가 번지면서 대출 금리 부담이 커질 수 있어요. 연말 자금 계획이 있다면 하루라도 빨리 여러 금융기관의 한도와 사전 심사를 꼼꼼히 확인해 두는 기민함이 필수입니다."}, {"speaker": "지민", "theme_id": "theme_3", "text": "선배님, 재건축해서 새 아파트 받는 건 좋은데, 입주도 전에 현금으로 2억 넘는 돈을 세금처럼 내라니 이게 ‘재초환’ 제도 때문인가요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "하하, 맞아요 지민님! 낡은 집을 부수고 새 아파트를 지어서 집값이 크게 뛰었을 때, 정상적인 집값 상승분과 공사비를 뺀 ‘초과 이익’의 최대 50%를 나라가 환수해 가는 제도예요. 로또 당첨금에서 세금을 떼듯 부동산 불로소득을 환수하겠다는 취지죠."}, {"speaker": "지민", "theme_id": "theme_3", "text": "우와, 2억 넘는 생돈을 마련해야 한다면 조합원들 부담이 엄청나겠어요! 그럼 이 부담금 때문에 다른 재건축 단지들도 사업을 미루게 될까요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "정확한 지적이에요! 수억 원대 현금 부담은 조합원 갈등과 사업 지연을 유발해 서울 도심의 신규 주택 공급을 위축시키는 부작용을 낳을 수 있습니다. 공급 부족 우려와 맞물려 신축 아파트의 희소성이 더 부각될 수도 있죠."}, {"speaker": "지민", "theme_id": "theme_3", "text": "그 뜨겁던 서울 아파트 시장이 갑자기 조용해지면서 상승세가 멈칫하고 있다는데, 시장 열기가 왜 이렇게 빠르게 식은 건가요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "음... 쉽게 비유하자면요, 난로에 장작(주택담보대출)을 계속 넣어줘야 불길이 활활 타오르는데, 정부가 대출 규제로 장작 공급을 딱 끊어버린 격이에요! 집을 사고 싶어도 돈 빌리기가 어려우니 매수자들이 한 발 물러서서 눈치만 보고 있는 거죠."}, {"speaker": "지민", "theme_id": "theme_3", "text": "아~ 대출 장작이 끊겨서 불길이 잦아들었군요! 그럼 무주택 실수요자들은 지금 집을 사야 할까요, 아니면 더 기다려야 할까요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "거래량이 동반되지 않은 보합세는 하락 전환의 전조일 수도 있고 일시적 숨 고르기일 수도 있어요. 금리 추이와 공급 지표를 확인하며 무리한 영끌보다는 경매나 급매물 중심의 보수적인 접근이 유효한 시점입니다."}, {"speaker": "지민", "theme_id": "theme_3", "text": "선배님, 똑같이 열심히 일해서 470만 원을 벌어도 빚이 있냐 없냐로 매달 저축이 50만 원 넘게 차이 난다니 너무 뼈아픈데요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "하하, 맞아요 지민님! 똑같은 배기량의 자동차인데 한쪽은 트렁크에 무거운 납덩어리(대출 이자)를 가득 싣고 달리는 것과 똑같아요. 숨만 쉬어도 매달 나가는 원리금 때문에 저축할 종잣돈이 메말라버리는 ‘부채의 덫’에 걸린 셈이죠."}, {"speaker": "지민", "theme_id": "theme_3", "text": "아... 매달 50만 원이면 1년이면 600만 원인데 복리로 굴리면 엄청난 차이잖아요! 그럼 직장인들은 빚부터 무조건 갚는 게 정답인가요?"}, {"speaker": "현우", "theme_id": "theme_3", "text": "그렇습니다! 고금리 환경에서는 확실한 투자 수익률을 내기 어려운 만큼, 빚을 갚아 확정 이자 비용을 줄이는 것이 가장 확실한 무위험 재테크예요. 원리금 상환액을 줄여 현금 흐름을 회복하는 것이 자산 관리의 제1원칙입니다."}, {"speaker": "지민", "theme_id": "theme_4", "text": "선배님, AI가 전문직 시험까지 척척 풀고 일하는 엄마들도 늘었다는데 세상이 정말 빠르게 바뀌고 있죠?"}, {"speaker": "현우", "theme_id": "theme_4", "text": "기술이 일자리와 시험의 룰을 송두리째 바꾸고 있으니까요. 제도와 정부 규제가 이런 급변기를 어떻게 뒷받침하고 있는지 같이 확인해 보시죠."}, {"speaker": "지민", "theme_id": "theme_4", "text": "지방에 AI 데이터센터를 지으면 전력 평가를 면제해 준다는데, 왜 이렇게 수도권을 피해서 지방으로 유치하려는 건가요?"}, {"speaker": "현우", "theme_id": "theme_4", "text": "음... 서울 강남 도로에 대형 트럭 수백 대가 한꺼번에 쏟아져 나오면 도로가 마비되는 것처럼, 수도권 전력망은 이미 과부하 상태예요! 반면 지방에는 발전소는 많은데 송전선이 부족하니, 전기를 많이 쓰는 대형 데이터센터를 발전소 근처 지방으로 유도하려는 고육지책이죠."}, {"speaker": "지민", "theme_id": "theme_4", "text": "아~ 전기가 남아도는 산지로 공장을 옮기게 길을 터주는 거군요! 그럼 지방 일자리 창출이나 지역 경제 활성화에도 꽤 도움이 될까요?"}, {"speaker": "현우", "theme_id": "theme_4", "text": "인프라 분산과 지역 균형 발전이라는 두 마리 토끼를 잡을 기회예요. 다만 데이터센터는 상주 고용 인원이 적은 편이라, 단순 유치를 넘어 지역 내 AI 스타트업 생태계와 연계해야 실질적인 경제 파급력을 극대화할 수 있습니다."}, {"speaker": "지민", "theme_id": "theme_4", "text": "선배님, 세무사 회계학 시험이 어렵기로 악명 높은데 AI가 100점 만점을 받았다니요? 게다가 실제 고득점자도 33배나 늘었다면서요?"}, {"speaker": "현우", "theme_id": "theme_4", "text": "하하, 맞아요 지민님! 마치 사람이 계산기 두드리며 끙끙 앓고 있을 때, 슈퍼컴퓨터 두뇌를 가진 천재 조수가 옆에서 실시간으로 완벽한 답안지를 대신 써준 격이에요! AI의 문제 풀이 능력이 인간 전문가 수준을 가뿐히 뛰어넘었다는 결정적 증거죠."}, {"speaker": "지민", "theme_id": "theme_4", "text": "헐, 정말 부정행위 의심이 나올 법도 하네요! 이렇게 되면 앞으로 자격증 시험이나 대학 입시 방식도 완전히 바뀌어야 하지 않을까요?"}, {"speaker": "현우", "t     }

    function renderEpisode(ep) {
      currentEpisode = ep;
      document.getElementById('ep-title').textContent = ep.episode_title || '모닝 경제·경영 2인 팟캐스트';
      document.getElementById('ep-date-label').textContent = ep.generated_at || ep.date || '';
      document.getElementById('ep-summary').textContent = ep.executive_summary || '';
      document.getElementById('glossary-count').textContent = (ep.glossary || []).length;

      const engine = (ep.audio && ep.audio.engine_used) || 'NOTEBOOKLM';
      const badgeEl = document.getElementById('engine-badge');
      badgeEl.textContent = engine.includes('NOTEBOOKLM')
        ? 'NOTEBOOKLM 2인 오디오 브리핑'
        : 'AI 2인 멀티보이스 브리핑';

      if (ep.audio && ep.audio.url) {
        audioEl.src = ep.audio.url;
      }

      renderFilters(ep);
      renderNewsList(ep);
      renderGlossary(ep);
      renderDialogue(ep);
    }

    function renderFilters(ep) {
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = '';
      const filters = [
        { id: 'all', label: '전체 뉴스 (20)' },
        { id: 'deep', label: '★ 심층 해설 이슈' },
        ...(ep.themes || []).map(t => ({ id: t.id, label: t.title.replace(/^[0-9]+\.\s*/, '') }))
      ];
      filters.forEach(f => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip' + (activeFilter === f.id ? ' active' : '');
        btn.textContent = f.label;
        btn.addEventListener('click', () => {
          activeFilter = f.id;
          renderFilters(currentEpisode);
          renderNewsList(currentEpisode);
        });
        bar.appendChild(btn);
      });
    }

    function renderNewsList(ep) {
      const container = document.getElementById('news-list-container');
      container.innerHTML = '';
      const themes = ep.themes || [];
      const items = ep.news_items || [];

      themes.forEach(theme => {
        if (activeFilter !== 'all' && activeFilter !== 'deep' && activeFilter !== theme.id) return;

        const themeItems = items.filter(item => {
          if (item.theme_id !== theme.id) return false;
          if (activeFilter === 'deep') return Boolean(item.is_deep_dive);
          return true;
        });

        if (themeItems.length === 0) return;

        const sec = document.createElement('div');
        sec.className = 'theme-section';
        sec.innerHTML = `
          <div class="theme-header">
            <h2>${theme.title}</h2>
            <p>${theme.summary}</p>
          </div>
        `;

        themeItems.forEach(item => {
          const card = document.createElement('article');
          card.className = 'news-card' + (item.is_deep_dive ? ' deep-dive' : '');
          const qna = item.beginner_qna || {};
          const termsHtml = (item.key_terms || [])
            .map(t => `<span class="term-tag">#${t}</span>`)
            .join('');

          card.innerHTML = `
            <div class="news-meta">
              <div class="news-badges">
                <span class="num-badge">NEWS #${item.id}</span>
                <span class="cat-badge">${item.category || '경제/경영'}</span>
                ${item.is_deep_dive ? '<span class="deep-badge">★ 핵심 심층해설</span>' : ''}
              </div>
              <span style="font-size:0.78rem;color:var(--text-muted)">${item.source || ''}</span>
            </div>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-summary">${item.summary}</p>
            <div class="meaning-box">
              <div class="meaning-label">💡 경제·경영적 의미 (왜 중요할까요?)</div>
              <div class="meaning-text">${item.economic_meaning}</div>
            </div>
            ${qna.question ? `
            <div class="qna-box">
              <div class="qna-q">🙋 지민의 질문: "${qna.question}"</div>
              <div class="qna-a">🎙️ 현우의 해설: "${qna.answer}"</div>
            </div>` : ''}
            <div class="news-footer">
              <div class="term-tags">${termsHtml}</div>
              <a class="source-link" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">원문 기사 보기 ↗</a>
            </div>
          `;
          sec.appendChild(card);
        });

        container.appendChild(sec);
      });
    }

    function renderGlossary(ep) {
      const container = document.getElementById('glossary-list-container');
      container.innerHTML = '';
      (ep.glossary || []).forEach(g => {
        const div = document.createElement('div');
        div.className = 'glossary-card';
        div.innerHTML = `
          <div class="glossary-term">🔹 ${g.term}</div>
          <div class="glossary-def">${g.simple_def}</div>
          <div class="glossary-analogy">💬 <strong>일상 비유:</strong> ${g.analogy}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderDialogue(ep) {
      const container = document.getElementById('script-list-container');
      container.innerHTML = '';
      (ep.dialogue || []).forEach(turn => {
        const isQ = turn.speaker === '지민';
        const div = document.createElement('div');
        div.className = 'dialogue-turn ' + (isQ ? 'speaker-q' : 'speaker-e');
        div.innerHTML = `
          <span class="speaker-name">${isQ ? '🙋 지민 (질문자)' : '🎙️ 현우 (경제 멘토)'}</span>
          <p class="dialogue-text">${turn.text}</p>
        `;
        container.appendChild(div);
      });
    }

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('view-news').classList.toggle('hidden', tab !== 'news');
        document.getElementById('view-glossary').classList.toggle('hidden', tab !== 'glossary');
        document.getElementById('view-script').classList.toggle('hidden', tab !== 'script');
      });
    });

    // 오디오 컨트롤
    playBtn.addEventListener('click', () => {
      if (audioEl.paused) {
        audioEl.play().then(() => {
          playBtn.textContent = '⏸ 일시정지';
        }).catch(() => {
          // 오디오 파일 로드 전이거나 브라우저 내장 음성 테스트 시
          statusText.textContent = '🎧 오디오 파일을 불러오는 중입니다...';
        });
      } else {
        audioEl.pause();
        playBtn.textContent = '▶ 브리핑 재생';
      }
    });

    audioEl.addEventListener('timeupdate', () => {
      if (audioEl.duration) {
        scrubber.value = (audioEl.currentTime / audioEl.duration) * 100;
        timeLabel.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      timeLabel.textContent = `00:00 / ${formatTime(audioEl.duration)}`;
    });

    audioEl.addEventListener('ended', () => {
      playBtn.textContent = '▶ 다시 재생';
    });

    scrubber.addEventListener('input', () => {
      if (audioEl.duration) {
        audioEl.currentTime = (scrubber.value / 100) * audioEl.duration;
      }
    });

    document.getElementById('btn-rw-15').addEventListener('click', () => {
      audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
    });

    document.getElementById('btn-ff-15').addEventListener('click', () => {
      audioEl.currentTime = Math.min(audioEl.duration || 9999, audioEl.currentTime + 15);
    });

    document.getElementById('btn-speed-cycle').addEventListener('click', (e) => {
      speedIdx = (speedIdx + 1) % speeds.length;
      audioEl.playbackRate = speeds[speedIdx];
      e.target.textContent = `${speeds[speedIdx].toFixed(2).replace(/\.00$/, '.0')}x 배속`;
    });

    // 에피소드 드롭다운 초기화
    const selectEl = document.getElementById('episode-select');
    EPISODES_INDEX.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.date;
      opt.textContent = `${item.date} (${item.weekday}) 브리핑`;
      selectEl.appendChild(opt);
    });

    selectEl.addEventListener('change', async (e) => {
      const epDate = e.target.value;
      try {
        const res = await fetch(`episodes/${epDate}.json`);
        if (res.ok) {
          const data = await res.json();
          renderEpisode(data);
        }
      } catch (err) {
        console.error(err);
      }
    });

    renderEpisode(INITIAL_EPISODE);
  </script>
</body>
</html>
