name: Morning Economic Podcast Briefing (Mon/Wed/Fri 07:30 KST)

on:
  schedule:
    # GitHub Actions 정각(:00, :10, :30) 큐 병목 지연을 피하기 위해 비혼잡 분(17, 53, 13, 27)에 4중 스케줄 등록
    # 1차 사전 생성: 한국 시간(KST) 월/수/금 오전 06:17 (오디오/웹 플레이어를 미리 빌드해 GitHub Pages에 배포)
    - cron: '17 21 * * 0,2,4'
    # 2차 사전 생성 및 07:30 정각 발송 대기: 한국 시간(KST) 월/수/금 오전 06:53
    - cron: '53 21 * * 0,2,4'
    # 3차 07:30 정각 발송 트리거: 한국 시간(KST) 월/수/금 오전 07:13
    - cron: '13 22 * * 0,2,4'
    # 4차 백업 발송 트리거: 한국 시간(KST) 월/수/금 오전 07:27
    - cron: '27 22 * * 0,2,4'
  workflow_dispatch:
    inputs:
      force_fallback:
        description: 'NotebookLM 생략 후 즉시 2인 멀티보이스 TTS 사용 여부'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: morning-briefing-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check Today Episode & Delivery Status
        id: status_check
        run: |
          git pull --rebase origin main || true
          TODAY_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          echo "today_kst=${TODAY_KST}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/episodes/.sent_${TODAY_KST}" ]; then
            echo "already_sent=true" >> $GITHUB_OUTPUT
            echo "✅ 오늘(${TODAY_KST}) 아침 브리핑 카카오톡 발송이 이미 완료되었으므로 백업 스케줄을 종료합니다."
          else
            echo "already_sent=false" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/episodes/${TODAY_KST}.json" ] && [ -f "docs/audio/briefing-${TODAY_KST}.mp3" ]; then
            echo "already_built=true" >> $GITHUB_OUTPUT
            echo "✅ 오늘(${TODAY_KST}) 오디오 브리핑이 이미 사전 생성되어 있습니다. 생성 단계를 건너뛰고 07:30 발송 단계로 이동합니다."
          else
            echo "already_built=false" >> $GITHUB_OUTPUT
          fi

      - name: Install System Audio Dependencies (ffmpeg) & Python Packages
        if: steps.status_check.outputs.already_sent != 'true'
        run: |
          if [ "${{ steps.status_check.outputs.already_built }}" != "true" ]; then
            which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          fi
          pip install -q -r requirements.txt

      - name: Generate 20-News Briefing, Audio Podcast & Web Player
        if: steps.status_check.outputs.already_sent != 'true' && steps.status_check.outputs.already_built != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_WEB_URL: ${{ secrets.PUBLIC_WEB_URL }}
          GOOGLE_STORAGE_STATE_B64: ${{ secrets.GOOGLE_STORAGE_STATE_B64 }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.force_fallback }}" = "true" ]; then
            python main.py --force-fallback --skip-kakao
          else
            python main.py --skip-kakao
          fi

      - name: Commit & Push Updated Audio and Web Player to GitHub Pages (docs/)
        if: steps.status_check.outputs.already_sent != 'true' && steps.status_check.outputs.already_built != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(briefing): publish morning economic podcast (${{ steps.status_check.outputs.today_kst }})"
            git pull --rebase origin main || true
            git push
          fi

      - name: Deliver KakaoTalk Notification at 07:30 AM KST Sharp
        if: steps.status_check.outputs.already_sent != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          PUBLIC_WEB_URL: ${{ secrets.PUBLIC_WEB_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -c "
          import json, os, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from src.config import PUBLIC_WEB_URL
          from src.kakao_notifier import send_kakao_briefing

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_str = now_kst.strftime('%Y-%m-%d')
          event_name = os.getenv('EVENT_NAME', '')

          if event_name == 'schedule':
              target_0730 = now_kst.replace(hour=7, minute=30, second=0, microsecond=0)
              wait_secs = (target_0730 - now_kst).total_seconds()
              # 만약 1차 사전 생성(06:17 KST)이 06:45 이전에 끝났다면 카톡은 2차/3차 스케줄이 정확히 07:30에 발송하도록 위임
              if wait_secs > 2400:
                  print(f'[Pre-Build Complete] 현재 시각 {now_kst.strftime(\"%H:%M:%S\")} KST. 오디오 사전 배포 완료! 카톡 발송은 07:30 정각 스케줄에서 실행됩니다.')
                  raise SystemExit(0)
              elif wait_secs > 0:
                  print(f'[07:30 KST Timer] 정확히 07:30:00 KST 발송을 위해 {int(wait_secs)}초 대기합니다...')
                  time.sleep(wait_secs)
          else:
              time.sleep(15)

          ep = json.loads(Path('docs/episodes/latest.json').read_text(encoding='utf-8'))
          web_url = f'{PUBLIC_WEB_URL}/?ep={ep[\"date\"]}'
          ok = send_kakao_briefing(ep, ep.get('audio', {}), web_url)
          if ok:
              for old_marker in Path('docs/episodes').glob('.sent_*'):
                  old_marker.unlink(missing_ok=True)
              Path(f'docs/episodes/.sent_{today_str}').write_text(datetime.now(KST).isoformat(), encoding='utf-8')
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/episodes/.sent_* || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(briefing): mark kakao sent (${{ steps.status_check.outputs.today_kst }})"
            git pull --rebase origin main || true
            git push
          fi
